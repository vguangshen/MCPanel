name: One-time Account API port editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-account-api-port-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply Account API port editor
        shell: pwsh
        run: python .\tools\Apply-AccountApiPortEditor.py

      - name: Test Account API port editor
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Commit feature
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add AccountApiManagerService.cs AccountApiPage.xaml AccountApiPage.xaml.cs PanelInputDialog.xaml PanelInputDialog.xaml.cs MCPanel.Tests/ReliabilityTests.AccountApiPortEditing.cs
          git commit -m "feat: allow editing Account API listen port"
          git push origin main
