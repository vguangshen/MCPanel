name: One-time Tomcat management trim

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trim:
    if: contains(github.event.head_commit.message, '[tomcat-trim-1.3.12]')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Trim Tomcat product management
        shell: pwsh
        run: .\tools\Trim-TomcatManagement-1.3.12.ps1

      - name: Commit validated source
        id: commit
        shell: pwsh
        run: |
          git config user.name 'Xiangming'
          git config user.email '40314529+vguangshen@users.noreply.github.com'
          git add -A
          git commit -m "Release MCPanel 1.3.12" -m "Remove product-level Stop and cache-clean-and-restart actions and their dedicated UI/backend code. Keep StopAsync only as an internal lifecycle primitive required by uninstall and global Tomcat management."
          git push origin HEAD:main
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build update assets
        shell: pwsh
        run: |
          $updatesDir = Join-Path $env:RUNNER_TEMP 'MCPanelUpdates'
          & .\Build-UpdatePackage.ps1 `
            -Version '1.3.12' `
            -PublishDirectory $env:MCPANEL_TRIM_PUBLISH_DIR `
            -OutputDirectory $updatesDir `
            -GitHubRelease `
            -ReleaseNotes '进一步精简 Java/Tomcat 产品管理：删除“停止应用”和“清理缓存并重启”按钮及对应产品级代码；保留 StopAsync 仅供卸载和全局 Tomcat 生命周期安全使用。'
          "MCPANEL_UPDATES_DIR=$updatesDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release 1.3.12
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '1.3.12'
          $tag = "v$version"
          $zip = Join-Path $env:MCPANEL_UPDATES_DIR "MCPanel-$version.zip"
          $hash = "$zip.sha256"
          $manifest = Join-Path $env:MCPANEL_UPDATES_DIR 'update-manifest.json'
          $notes = @"
          本版本继续压缩 Java/Tomcat 产品管理按钮数量。

          - 删除“停止应用”产品级按钮和对应界面分发。
          - 删除“清理缓存并重启”按钮、状态绑定、分发逻辑及 ClearCacheAndRestartAsync 专用后端实现。
          - 保留“单独启动”“以 Catalina 方式启动”“查看日志”。
          - StopAsync 底层停止逻辑继续保留，但仅作为卸载、总 Tomcat 切换和内部生命周期安全能力，不再暴露为产品管理按钮。
          - 保留 IIS 管理、修复绑定、域名与 SSL、卸载等其他功能。
          - 已执行完整测试和 Win-x64 publish 校验。
          "@
          gh release create $tag $zip $hash $manifest `
            --target '${{ steps.commit.outputs.sha }}' `
            --title "MCPanel $version" `
            --notes $notes
