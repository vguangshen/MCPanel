name: One-time Tomcat backend cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[tomcat-backend-cleanup]')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Prune retired Tomcat UI and backend capabilities
        shell: pwsh
        run: .\tools\Prune-TomcatBackend-1.3.11-v5.ps1
