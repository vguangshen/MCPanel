name: One-time Tomcat backend cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[tomcat-backend-cleanup]')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prune retired Tomcat UI and backend capabilities
        shell: pwsh
        run: .\tools\Prune-TomcatBackend-1.3.11-v4.ps1
