name: Apply 1.2.9 reliability patch

on:
  push:
    branches:
      - fix/1.2.9-reliability

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.2.9-reliability
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply targeted reliability fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8-sig' if path.endswith('.csproj') else 'utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 regex match, found {count}')
              return updated

          # Version bump only. Download transport/catalog behavior is intentionally untouched.
          path = 'MCPanel.csproj'
          text = read(path)
          text = replace_once(text, '<Version>1.2.8</Version>', '<Version>1.2.9</Version>', 'project version')
          text = replace_once(text, '<FileVersion>1.2.8.0</FileVersion>', '<FileVersion>1.2.9.0</FileVersion>', 'file version')
          text = replace_once(text, '<AssemblyVersion>1.2.8.0</AssemblyVersion>', '<AssemblyVersion>1.2.9.0</AssemblyVersion>', 'assembly version')
          write(path, text)

          # Damaged MySQL credential state must never silently fall back to the original default password.
          path = 'MySqlCredentialStore.cs'
          text = read(path)
          text = regex_once(
              text,
              r'    public static MySqlDefaultCredentials Load\(\)\n    \{.*?\n    \}\n\n    public static MySqlDefaultCredentials CreateNew\(\)',
              '''    public static MySqlDefaultCredentials Load()\n    {\n        var foundCredentialFile = false;\n        Exception? credentialReadError = null;\n        foreach (var file in CandidateCredentialFiles())\n        {\n            if (!File.Exists(file))\n            {\n                continue;\n            }\n\n            foundCredentialFile = true;\n            try\n            {\n                var credentials = JsonSerializer.Deserialize<MySqlDefaultCredentials>(File.ReadAllText(file));\n                if (credentials is null || string.IsNullOrWhiteSpace(credentials.Password))\n                {\n                    credentialReadError = new InvalidDataException($"MySQL 本地凭据文件内容无效：{file}");\n                    continue;\n                }\n\n                var wasProtected = LocalSecretProtector.IsProtected(credentials.Password);\n                var normalized = credentials with { Password = LocalSecretProtector.Unprotect(credentials.Password) };\n                if (string.IsNullOrWhiteSpace(normalized.Password))\n                {\n                    credentialReadError = new InvalidDataException($"MySQL 本地凭据文件中的密码为空：{file}");\n                    continue;\n                }\n\n                if (!PathsEqual(file, CredentialFile) || !wasProtected)\n                {\n                    Save(normalized);\n                }\n\n                return WithConfiguredPort(normalized);\n            }\n            catch (LocalSecretUnavailableException)\n            {\n                throw;\n            }\n            catch (Exception error)\n            {\n                credentialReadError = error;\n            }\n        }\n\n        if (foundCredentialFile)\n        {\n            throw new InvalidDataException(\n                "MySQL 本地凭据文件已损坏或无法读取。为避免误改 root 密码，MCPanel 不会自动回退到默认密码；请恢复凭据文件或重新安装 MySQL。",\n                credentialReadError);\n        }\n\n        return WithConfiguredPort(new MySqlDefaultCredentials("127.0.0.1", DefaultPort, "root", OriginalDefaultPassword));\n    }\n\n    public static MySqlDefaultCredentials CreateNew()''',
              'MySQL credential loader')
          write(path, text)

          # Damaged SQL Server credential state must not invent a new random sa password.
          path = 'SqlServerCredentialStore.cs'
          text = read(path)
          text = regex_once(
              text,
              r'    private static SqlServerDefaultCredentials LoadPersistedCredentials\(\)\n    \{.*?\n    \}\n\n    private static IEnumerable<RegistryView> RegistryViews\(\)',
              '''    private static SqlServerDefaultCredentials LoadPersistedCredentials()\n    {\n        var file = CredentialFile;\n        if (!File.Exists(file))\n        {\n            return Defaults;\n        }\n\n        try\n        {\n            var credentials = JsonSerializer.Deserialize<SqlServerDefaultCredentials>(File.ReadAllText(file));\n            if (credentials is null || string.IsNullOrWhiteSpace(credentials.Password))\n            {\n                throw new InvalidDataException("SQL Server 本地凭据文件内容无效。");\n            }\n\n            var wasProtected = LocalSecretProtector.IsProtected(credentials.Password);\n            var normalized = credentials with\n            {\n                Host = NormalizeLocalHost(credentials.Host),\n                Password = LocalSecretProtector.Unprotect(credentials.Password)\n            };\n            if (string.IsNullOrWhiteSpace(normalized.Password))\n            {\n                throw new InvalidDataException("SQL Server 本地凭据文件中的密码为空。");\n            }\n\n            if (!wasProtected)\n            {\n                Save(normalized);\n            }\n\n            return normalized;\n        }\n        catch (LocalSecretUnavailableException)\n        {\n            throw;\n        }\n        catch (InvalidDataException)\n        {\n            throw;\n        }\n        catch (Exception error)\n        {\n            throw new InvalidDataException(\n                "SQL Server 本地凭据文件已损坏或无法读取。MCPanel 不会生成一套新的随机 sa 密码冒充现有凭据；请恢复凭据文件或重新配置连接信息。",\n                error);\n        }\n    }\n\n    private static IEnumerable<RegistryView> RegistryViews()''',
              'SQL Server credential loader')
          write(path, text)

          # Nginx managed certificate cleanup becomes commit-after-config: remove rules first, certs second.
          path = 'ProductWebsiteService.cs'
          text = read(path)
          text = replace_once(
              text,
              '''        DeleteManagedCertificatesFromKnownRoots(productId);\n\n        // A deleted/corrupted product-state file can make Load return Default\n        // while the Nginx rule and certificate directory still exist.  Check the\n        // persisted rule itself so uninstall remains idempotent and complete.\n        if (!hasManagedRule)\n        {\n            return;\n        }\n\n        if (service.IsNginxInstalled())\n        {\n            await service.SaveAsync(productId, ProductWebsiteSettings.Default, cancellationToken);\n            return;\n        }\n\n        var rules = current.Rules\n            .Where(rule => !string.Equals(rule.ManagedWebsiteId, managedId, StringComparison.OrdinalIgnoreCase))\n            .Select(NginxRuntimeManager.NormalizeRule)\n            .ToList();\n        EnsureAtLeastOneRule(rules, current);\n        NginxRuntimeManager.SaveOptions(CreateOptions(current, rules));''',
              '''        // A deleted/corrupted product-state file can make Load return Default\n        // while the Nginx rule and certificate directory still exist. Check the\n        // persisted rule itself so uninstall remains idempotent and complete.\n        // Certificate files are deliberately deleted only after the rule update\n        // succeeds; otherwise a failed config save could leave Nginx referencing\n        // certificate paths that MCPanel had already removed.\n        if (!hasManagedRule)\n        {\n            DeleteManagedCertificatesFromKnownRoots(productId);\n            return;\n        }\n\n        if (service.IsNginxInstalled())\n        {\n            await service.SaveAsync(productId, ProductWebsiteSettings.Default, cancellationToken);\n            DeleteManagedCertificatesFromKnownRoots(productId);\n            return;\n        }\n\n        var rules = current.Rules\n            .Where(rule => !string.Equals(rule.ManagedWebsiteId, managedId, StringComparison.OrdinalIgnoreCase))\n            .Select(NginxRuntimeManager.NormalizeRule)\n            .ToList();\n        EnsureAtLeastOneRule(rules, current);\n        NginxRuntimeManager.SaveOptions(CreateOptions(current, rules));\n        DeleteManagedCertificatesFromKnownRoots(productId);''',
              'managed certificate removal order')
          write(path, text)

          # Environment runtime: do not swallow real stop failures, do not silently reset MySQL root password,
          # and narrow SQL Server uninstall to the MCPanel-managed default instance.
          path = 'EnvironmentRuntimeService.cs'
          text = read(path)
          text = replace_once(
              text,
              '''        try\n        {\n            await StopAsync(kind, cancellationToken);\n        }\n        catch\n        {\n            // Continue with start even when the service was already stopped.\n        }\n\n        await Task.Delay(1200, cancellationToken);''',
              '''        try\n        {\n            await StopAsync(kind, cancellationToken);\n        }\n        catch (Exception stopError)\n        {\n            // A stop command may report an error even though the process/service\n            // actually reached Stopped. Continue only in that benign case.\n            if (IsRunning(kind))\n            {\n                throw new InvalidOperationException(\n                    $"{DisplayName(kind)} 停止失败，当前仍在运行，已取消重启：{stopError.Message}",\n                    stopError);\n            }\n        }\n\n        await Task.Delay(1200, cancellationToken);''',
              'restart stop verification')

          text = text.replace(
              '''                        if (!(Test-RootPassword $paths)) { Reset-RootPassword $paths }''',
              '''                        if (!(Test-RootPassword $paths)) { Fail 'MySQL 已启动，但保存的 root 凭据无法验证。为避免意外修改数据库密码，MCPanel 已停止自动重置；请恢复正确的凭据文件后重试。' }''')
          if 'Reset-RootPassword $paths' in text:
              raise RuntimeError('MySQL service actions still contain an automatic Reset-RootPassword call')

          text = regex_once(
              text,
              r"            Invoke-Step '停止 SQL Server 服务' \{.*?\n            \}\n\n            Invoke-Step '调用官方安装器卸载 SQL Server 实例' \{",
              '''            Invoke-Step '停止 MCPanel SQL Server 默认实例服务' {\n                Get-Service -ErrorAction SilentlyContinue | Where-Object {\n                    $_.Name -in @('MSSQLSERVER','SQLSERVERAGENT')\n                } | ForEach-Object { Stop-Sql-Service $_.Name }\n            }\n\n            Invoke-Step '调用官方安装器卸载 SQL Server 默认实例' {''',
              'SQL stop scope')

          text = regex_once(
              text,
              r"                \$instanceNames = @\('MSSQLSERVER'\).*?                \$instanceNames = \$instanceNames \| Where-Object \{ \$_ \} \| Sort-Object -Unique\n",
              "                $instanceNames = @('MSSQLSERVER')\n",
              'SQL instance enumeration')

          # Do not search arbitrary Program Files setup media; use only MCPanel-owned installer/media roots.
          text = text.replace(
              '''                    $legacyDataRoot,\n                    (Join-Path $env:ProgramFiles 'Microsoft SQL Server'),\n                    (Join-Path ${env:ProgramFiles(x86)} 'Microsoft SQL Server')''',
              '''                    $legacyDataRoot''')

          text = regex_once(
              text,
              r"            Invoke-Step '卸载 SQL Server MSI 组件' \{.*?\n            \}\n\n            Invoke-Step '删除残留 SQL Server 服务项' \{",
              '''            Invoke-Step '保留共享 SQL Server 客户端组件' {\n                Write-Output '保留 SQL Native Client、ODBC/OLE DB Driver、SQL Browser、VSS Writer 等共享组件，避免影响其他软件或 SQL Server 实例。'\n            }\n\n            Invoke-Step '删除 MCPanel SQL Server 默认实例残留服务项' {''',
              'SQL shared MSI preservation')

          text = regex_once(
              text,
              r"            Invoke-Step '删除 MCPanel SQL Server 默认实例残留服务项' \{.*?\n            \}\n\n            Invoke-Step '删除残留目录' \{",
              '''            Invoke-Step '删除 MCPanel SQL Server 默认实例残留服务项' {\n                Get-Service -ErrorAction SilentlyContinue | Where-Object {\n                    $_.Name -in @('MSSQLSERVER','SQLSERVERAGENT')\n                } | ForEach-Object { Delete-Sql-Service $_.Name }\n            }\n\n            Invoke-Step '删除 MCPanel 管理目录和安装缓存' {''',
              'SQL residual service scope')

          text = regex_once(
              text,
              r"            Invoke-Step '删除 MCPanel 管理目录和安装缓存' \{.*?\n            \}\n\n            Invoke-Step '清理 SQL Server 注册表' \{",
              '''            Invoke-Step '删除 MCPanel 管理目录和安装缓存' {\n                $paths = @(\n                    $componentRoot,\n                    $migratedDataRoot,\n                    $legacyDataRoot,\n                    (Join-Path $workRoot 'SqlServer2012ExpressMedia'),\n                    (Join-Path $workRoot 'SqlServer2022ExpressMedia'),\n                    (Join-Path $workRoot 'SqlServer2025ExpressMedia'),\n                    (Join-Path $workRoot 'SqlServer2025EnterpriseDeveloperMedia'),\n                    (Join-Path $workRoot 'SqlServer2017ExpressMedia')\n                )\n                foreach ($path in $paths) { Remove-Tree $path }\n            }\n\n            Invoke-Step '保留共享 SQL Server 注册表与程序目录' {''',
              'SQL directory scope')

          text = regex_once(
              text,
              r"            Invoke-Step '保留共享 SQL Server 注册表与程序目录' \{.*?\n            \}\n\n            Invoke-Step '清理防火墙规则和环境项' \{",
              '''            Invoke-Step '保留共享 SQL Server 注册表与程序目录' {\n                Write-Output '全局 Microsoft SQL Server 注册表树、Program Files 和 ProgramData 由官方卸载器管理；MCPanel 不再强制删除，以保护其他实例。'\n                Write-Output '保留 Windows NVMe 4KB 扇区兼容项，避免 SQL Server 卸载后立即重装需要重启系统。'\n            }\n\n            Invoke-Step '清理 MCPanel SQL Server 防火墙规则' {''',
              'SQL registry preservation')

          text = regex_once(
              text,
              r"            Invoke-Step '清理 MCPanel SQL Server 防火墙规则' \{.*?\n            \}\n\n            \$remainingServices = @\(Get-Service -ErrorAction SilentlyContinue \| Where-Object \{.*?\n            \}\)",
              '''            Invoke-Step '清理 MCPanel SQL Server 防火墙规则' {\n                Get-NetFirewallRule -ErrorAction SilentlyContinue |\n                    Where-Object { $_.DisplayName -like 'MCPanel SQL Server *' } |\n                    Remove-NetFirewallRule -ErrorAction SilentlyContinue\n            }\n\n            $remainingServices = @(Get-Service -ErrorAction SilentlyContinue | Where-Object {\n                $_.Name -in @('MSSQLSERVER','SQLSERVERAGENT')\n            })''',
              'SQL firewall and verification scope')

          text = replace_once(
              text,
              '''                return "SQL Server 已执行完整卸载清理。建议重启 Windows 后再重新安装。";''',
              '''                return "SQL Server 默认实例及 MCPanel 管理的数据、安装缓存和防火墙规则已卸载；共享驱动、其他实例及全局 SQL Server 目录已保留。";''',
              'SQL uninstall result text')
          write(path, text)

          # Product state corruption: quarantine damaged JSON instead of deleting the only recovery clue.
          path = 'ProductDeploymentService.cs'
          text = read(path)
          start = text.index('    public void PruneStaleDeploymentState()')
          end = text.index('    public async Task<ProductDeploymentResult> DeployAsync', start)
          method = text[start:end]
          old_catch = '''            catch\n            {\n                DeleteFileIfExists(stateFile);\n            }'''
          count = method.count(old_catch)
          if count != 2:
              raise RuntimeError(f'PruneStaleDeploymentState expected 2 destructive catch blocks, found {count}')
          method = method.replace(old_catch, '''            catch (Exception error)\n            {\n                QuarantineCorruptDeploymentState(stateFile, error);\n            }''')
          helper = '''    private static void QuarantineCorruptDeploymentState(string stateFile, Exception error)\n    {\n        try\n        {\n            if (!File.Exists(stateFile))\n            {\n                return;\n            }\n\n            var timestamp = DateTime.Now.ToString("yyyyMMdd-HHmmss");\n            var quarantine = stateFile + $".corrupt-{timestamp}";\n            for (var suffix = 1; File.Exists(quarantine); suffix++)\n            {\n                quarantine = stateFile + $".corrupt-{timestamp}-{suffix}";\n            }\n\n            File.Move(stateFile, quarantine);\n            Directory.CreateDirectory(ComponentPaths.WorkRoot);\n            RollingLogWriter.Append(\n                Path.Combine(ComponentPaths.WorkRoot, "deployment-state-recovery.log"),\n                $"[{DateTime.Now:yyyy-MM-dd HH:mm:ss}] 部署状态文件损坏，已隔离而不是删除：{stateFile} -> {quarantine}{Environment.NewLine}{error}{Environment.NewLine}{Environment.NewLine}",\n                Encoding.UTF8);\n        }\n        catch\n        {\n            // A damaged state file must not prevent MCPanel from opening. If it\n            // cannot be quarantined, leave it in place for a later repair.\n        }\n    }\n\n'''
          text = text[:start] + method + helper + text[end:]
          write(path, text)

          # Update package declared version must match the actual MCPanel.exe FileVersion.
          path = 'ApplicationUpdateService.cs'
          text = read(path)
          text = replace_once(
              text,
              '''            var fileVersion = FileVersionInfo.GetVersionInfo(executable).FileVersion ?? string.Empty;\n            var version = string.IsNullOrWhiteSpace(declaredVersion) ? NormalizeVersionText(fileVersion) : NormalizeVersionText(declaredVersion);\n            if (!Version.TryParse(version, out _)) throw new InvalidDataException("更新包版本号无效。");''',
              '''            var fileVersion = FileVersionInfo.GetVersionInfo(executable).FileVersion ?? string.Empty;\n            var executableVersionText = NormalizeVersionText(fileVersion);\n            var version = string.IsNullOrWhiteSpace(declaredVersion) ? executableVersionText : NormalizeVersionText(declaredVersion);\n            if (!Version.TryParse(version, out var parsedVersion)) throw new InvalidDataException("更新包版本号无效。");\n            if (!Version.TryParse(executableVersionText, out var executableVersion))\n                throw new InvalidDataException("更新包中的 MCPanel.exe FileVersion 无效，无法确认版本绑定。");\n            if (!string.IsNullOrWhiteSpace(declaredVersion))\n            {\n                var normalizedDeclared = new Version(\n                    parsedVersion.Major,\n                    parsedVersion.Minor,\n                    Math.Max(0, parsedVersion.Build),\n                    Math.Max(0, parsedVersion.Revision));\n                var normalizedExecutable = new Version(\n                    executableVersion.Major,\n                    executableVersion.Minor,\n                    Math.Max(0, executableVersion.Build),\n                    Math.Max(0, executableVersion.Revision));\n                if (!normalizedDeclared.Equals(normalizedExecutable))\n                {\n                    throw new InvalidDataException(\n                        $"更新清单声明版本 {version}，但包内 MCPanel.exe FileVersion 为 {executableVersionText}，已拒绝应用该更新包。");\n                }\n            }''',
              'update version binding')
          write(path, text)

          # SQL Server uninstall confirmation now reflects scoped behavior.
          path = 'MainWindow.EnvironmentActions.cs'
          if Path(path).exists():
              text = read(path)
              old = '''        EnvironmentKind.SqlServer => "确定完整卸载 SQL Server 吗？\\n会停止并移除 SQL Server 服务、相关系统组件、注册表项、Program Files/ProgramData 残留目录，以及 MCPanel 的 MSSQL 数据目录。\\n仅在确认本机没有其他需要保留的 SQL Server 实例时执行。",'''
              new = '''        EnvironmentKind.SqlServer => "确定卸载 MCPanel 使用的 SQL Server 默认实例吗？\\n会停止并移除 MSSQLSERVER 默认实例，以及 MCPanel 的数据、安装缓存和防火墙规则；其他 SQL Server 实例、共享 ODBC/OLE DB 驱动和全局程序目录会保留。",'''
              text = replace_once(text, old, new, 'SQL uninstall confirmation')
              write(path, text)
          else:
              path = 'MainWindow.xaml.cs'
              text = read(path)
              old = '''        EnvironmentKind.SqlServer => "确定完整卸载 SQL Server 吗？\\n会停止并移除 SQL Server 服务、相关系统组件、注册表项、Program Files/ProgramData 残留目录，以及 MCPanel 的 MSSQL 数据目录。\\n仅在确认本机没有其他需要保留的 SQL Server 实例时执行。",'''
              new = '''        EnvironmentKind.SqlServer => "确定卸载 MCPanel 使用的 SQL Server 默认实例吗？\\n会停止并移除 MSSQLSERVER 默认实例，以及 MCPanel 的数据、安装缓存和防火墙规则；其他 SQL Server 实例、共享 ODBC/OLE DB 驱动和全局程序目录会保留。",'''
              text = replace_once(text, old, new, 'SQL uninstall confirmation')
              write(path, text)

          # Existing remote-update test used a deliberately fake manifest version; version binding now forbids that.
          candidates = list(Path('MCPanel.Tests').glob('ReliabilityTests*.cs'))
          changed_fake_version = 0
          for candidate in candidates:
              t = candidate.read_text(encoding='utf-8-sig')
              if 'const string version = "999.0.0.1";' in t:
                  t = t.replace('const string version = "999.0.0.1";', 'var version = ApplicationUpdateService.CurrentVersion.ToString();', 1)
                  candidate.write_text(t, encoding='utf-8')
                  changed_fake_version += 1
          if changed_fake_version != 1:
              raise RuntimeError(f'expected to update one fake remote-update version test, changed {changed_fake_version}')

          # Focused regression tests for the new reliability boundaries.
          test_path = Path('MCPanel.Tests/ReliabilityTests.129Reliability.cs')
          test_path.write_text(r'''using System.IO;
using Microsoft.VisualStudio.TestTools.UnitTesting;

namespace MCPanel.Tests;

public sealed partial class ReliabilityTests
{
    [TestMethod]
    public void SqlServerUninstallPreservesSharedAndUnrelatedComponents()
    {
        var script = EnvironmentRuntimeService.BuildSqlServerUninstallScript("scope-test.log");

        StringAssert.Contains(script, "@('MSSQLSERVER','SQLSERVERAGENT')");
        StringAssert.Contains(script, "保留 SQL Native Client、ODBC/OLE DB Driver");
        StringAssert.Contains(script, "Where-Object { $_.DisplayName -like 'MCPanel SQL Server *' }");
        Assert.IsFalse(script.Contains("$_.Name -like 'MSSQL$*'"));
        Assert.IsFalse(script.Contains("$_.Name -like 'SQLAgent$*'"));
        Assert.IsFalse(script.Contains("Microsoft ODBC Driver.*SQL"));
        Assert.IsFalse(script.Contains("Microsoft OLE DB Driver.*SQL"));
        Assert.IsFalse(script.Contains("(Join-Path $env:ProgramFiles 'Microsoft SQL Server')"));
        Assert.IsFalse(script.Contains("Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue\n                    }\n                }\n                Write-Output '保留 Windows NVMe", System.StringComparison.Ordinal));
    }

    [TestMethod]
    public void MySqlStartDoesNotSilentlyResetRootPassword()
    {
        var script = EnvironmentRuntimeService.BuildMySqlServiceActionScript(
            "start",
            "mysql-action.log",
            "mysql-action.result");

        Assert.IsFalse(script.Contains("Reset-RootPassword $paths", System.StringComparison.Ordinal));
        StringAssert.Contains(script, "为避免意外修改数据库密码，MCPanel 已停止自动重置");
    }

    [TestMethod]
    public void DamagedSqlServerCredentialFileIsRejectedInsteadOfInventingPassword()
    {
        var file = Path.Combine(ComponentPaths.RuntimeStateRoot, "sqlserver-default.json");
        var existed = File.Exists(file);
        var backup = existed ? File.ReadAllBytes(file) : null;
        Directory.CreateDirectory(Path.GetDirectoryName(file)!);
        try
        {
            File.WriteAllText(file, "{broken-json");
            Assert.ThrowsException<InvalidDataException>(() => SqlServerCredentialStore.Load());
        }
        finally
        {
            if (backup is not null) File.WriteAllBytes(file, backup);
            else if (File.Exists(file)) File.Delete(file);
        }
    }

    [TestMethod]
    public void DamagedMySqlCredentialFileIsRejectedInsteadOfFallingBackToMike()
    {
        var file = Path.Combine(ComponentPaths.RuntimeStateRoot, "mysql-default.json");
        var existed = File.Exists(file);
        var backup = existed ? File.ReadAllBytes(file) : null;
        Directory.CreateDirectory(Path.GetDirectoryName(file)!);
        try
        {
            File.WriteAllText(file, "{broken-json");
            Assert.ThrowsException<InvalidDataException>(() => MySqlCredentialStore.Load());
        }
        finally
        {
            if (backup is not null) File.WriteAllBytes(file, backup);
            else if (File.Exists(file)) File.Delete(file);
        }
    }
}
''', encoding='utf-8')

      - name: Restore
        shell: pwsh
        run: dotnet restore MCPanel.Tests/MCPanel.Tests.csproj

      - name: Test
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --no-restore

      - name: Commit tested patch and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-1.2.9-reliability.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden 1.2.9 runtime recovery [skip ci]"
          git push origin HEAD:fix/1.2.9-reliability
