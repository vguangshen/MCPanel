name: One-time download queue tabs completion time

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-download-queue-tabs-time.yml'
      - '.github/scripts/apply-download-queue-tabs-time.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose base patch line
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          workflow = Path('.github/workflows/one-time-download-queue-tabs.yml').read_text(encoding='utf-8-sig').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "@'")
          end = next(i for i, line in enumerate(workflow[start + 1:], start + 1) if line.strip() == "'@ | python -")
          lines = [line[10:] if line.startswith('          ') else line for line in workflow[start + 1:end]]
          for number in range(186, 202):
              if number <= len(lines):
                  print(f'{number}: {lines[number - 1]}')
          raise SystemExit(1)
          '@ | python -
