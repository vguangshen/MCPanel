name: Validate Environment UI 1.3.9

on:
  push:
    branches:
      - fix/1.3.9-environment-page-render
    paths:
      - .github/workflows/validate-environment-ui-139.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install VC++ runtime dependencies.' }

      - name: Apply Environment page XAML hotfix
        shell: pwsh
        run: |
          $templatesPath = 'Resources/MainWindowTemplates.xaml'
          $templates = [System.IO.File]::ReadAllText($templatesPath).Replace("`r`n", "`n")

          $comboPattern = '(?m)^(\s*)<ComboBox Style="\{DynamicResource EnvironmentVersionComboBox\}"\n\s*ItemsSource="\{Binding SqlServerReleaseOptions\}"'
          $comboMatches = [regex]::Matches($templates, $comboPattern)
          if ($comboMatches.Count -ne 1) { throw "Could not uniquely locate SQL Server ComboBox: $($comboMatches.Count) matches." }
          $indent = $comboMatches[0].Groups[1].Value
          $comboReplacement = $indent + '<ComboBox Style="{DynamicResource EnvironmentVersionComboBox}"' + "`n" +
              $indent + '          ItemContainerStyle="{DynamicResource SqlServerEnvironmentVersionComboBoxItem}"' + "`n" +
              $indent + '          ItemsSource="{Binding SqlServerReleaseOptions}"'
          $templates = [regex]::Replace($templates, $comboPattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $comboReplacement }, 1)

          $nestedPattern = '(?ms)^\s*<ComboBox\.ItemContainerStyle>\s*<Style TargetType="ComboBoxItem" BasedOn="\{DynamicResource EnvironmentVersionComboBoxItem\}">.*?</ComboBox\.ItemContainerStyle>\n?'
          $nestedMatches = [regex]::Matches($templates, $nestedPattern)
          if ($nestedMatches.Count -ne 1) { throw "Could not uniquely locate invalid inline SQL Server item style: $($nestedMatches.Count) matches." }
          $templates = [regex]::Replace($templates, $nestedPattern, '', 1)
          [System.IO.File]::WriteAllText($templatesPath, $templates, [System.Text.UTF8Encoding]::new($false))

          $themePath = 'Resources/PanelTheme.xaml'
          $theme = [System.IO.File]::ReadAllText($themePath).Replace("`r`n", "`n")
          $anchor = '    <Style x:Key="ProductUpdateButton" TargetType="Button" BasedOn="{StaticResource EnvironmentWarningButton}">'
          if (([regex]::Matches($theme, [regex]::Escape($anchor))).Count -ne 1) { throw 'Could not uniquely locate PanelTheme insertion point.' }
          $derivedLines = @(
              '    <Style x:Key="SqlServerEnvironmentVersionComboBoxItem"',
              '           TargetType="ComboBoxItem"',
              '           BasedOn="{StaticResource EnvironmentVersionComboBoxItem}">',
              '        <Style.Triggers>',
              '            <DataTrigger Binding="{Binding IsSupported}" Value="False">',
              '                <Setter Property="IsEnabled" Value="False" />',
              '                <Setter Property="ToolTip" Value="{Binding SupportNote}" />',
              '                <Setter Property="Opacity" Value="0.55" />',
              '            </DataTrigger>',
              '        </Style.Triggers>',
              '    </Style>',
              ''
          )
          $derivedStyle = ($derivedLines -join "`n") + "`n"
          $theme = $theme.Replace($anchor, $derivedStyle + $anchor)
          [System.IO.File]::WriteAllText($themePath, $theme, [System.Text.UTF8Encoding]::new($false))

      - name: Guard original product download chain
        shell: pwsh
        run: |
          git fetch origin main --quiet
          $protected = @('McPanelStoreClient.cs','SvnProductTransferService.cs','DownloadService.cs')
          foreach ($file in $protected) {
            git diff --exit-code origin/main -- $file
            if ($LASTEXITCODE -ne 0) { throw "Protected product download-chain file changed: $file" }
          }

      - name: Test and publish
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Reliability tests failed.' }
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish139'
          .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          if (!(Test-Path (Join-Path $publishDir 'MCPanel.exe'))) { throw 'Published MCPanel.exe not found.' }

      - name: Commit validated XAML fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Resources/MainWindowTemplates.xaml Resources/PanelTheme.xaml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Environment XAML hotfix produced no change.' }
          git commit -m 'Fix Environment page SQL Server selector rendering'
          git push origin HEAD:fix/1.3.9-environment-page-render
