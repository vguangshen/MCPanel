name: One-time product progress semantics v4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-product-progress-semantics-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply product progress patch
        shell: pwsh
        run: |
          python .\tools\Apply-ProductProgressSemantics.py
          @'
          from pathlib import Path
          path = Path('Controls/PanelProgressControls.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        if (IsIndeterminate)
          {
              var startAngle = IndeterminateAngle - 90d;
              var endAngle = startAngle + 96d;
              var start = PointOnCircle(center, radius, startAngle);
              var end = PointOnCircle(center, radius, endAngle);
              var geometry = new StreamGeometry();
              using (var context = geometry.Open())
              {
                  context.BeginFigure(start, isFilled: false, isClosed: false);
                  context.ArcTo(end, new Size(radius, radius), 0, false, SweepDirection.Clockwise, true, false);
              }

              geometry.Freeze();
              drawingContext.DrawGeometry(null, progressPen, geometry);
              return;
          }'''
          new = '''        if (IsIndeterminate)
          {
              var activityStartAngle = IndeterminateAngle - 90d;
              var activityEndAngle = activityStartAngle + 96d;
              var activityStart = PointOnCircle(center, radius, activityStartAngle);
              var activityEnd = PointOnCircle(center, radius, activityEndAngle);
              var activityGeometry = new StreamGeometry();
              using (var activityContext = activityGeometry.Open())
              {
                  activityContext.BeginFigure(activityStart, isFilled: false, isClosed: false);
                  activityContext.ArcTo(activityEnd, new Size(radius, radius), 0, false, SweepDirection.Clockwise, true, false);
              }

              activityGeometry.Freeze();
              drawingContext.DrawGeometry(null, progressPen, activityGeometry);
              return;
          }'''
          if text.count(old) != 1:
              raise RuntimeError('Could not find generated indeterminate arc block.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -

      - name: Test product progress semantics
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add ProductDownloadProgress.cs McPanelStoreClient.cs ProductInstallWorker.cs ProductInstallQueue.cs MainWindow.Products.cs Controls/PanelProgressControls.cs ViewModels/ProductViewModels.cs MainWindow.xaml Resources/MainWindowTemplates.xaml MCPanel.Tests/ReliabilityTests.ProductProgressSemantics.cs
          git commit -m "ui: use stage-aware product transfer progress"
          git push origin main
