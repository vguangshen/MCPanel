name: One-time Tomcat trim 1.3.12

on:
  push:
    paths:
      - '.github/workflows/tomcat-trim-1.3.12.yml'

permissions:
  contents: write

jobs:
  trim-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install VC++ runtime dependencies.' }

      - name: Remove Stop and cache-restart product actions
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Remove the two product-management buttons from XAML.
          xaml_path = 'Resources/MainWindowTemplates.xaml'
          xaml = read(xaml_path)
          for label in ('停止应用', '清理缓存并重启'):
              pattern = rf'\n\s*<Button Content="{re.escape(label)}".*?/>\s*'
              xaml, count = re.subn(pattern, '\n', xaml, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{xaml_path}: expected one {label} button, got {count}')
          write(xaml_path, xaml)

          # 2) Remove product-level Stop/ClearCacheRestart dispatch, while preserving
          #    StopAsync because uninstall and global Tomcat lifecycle still need it.
          products_path = 'MainWindow.Products.cs'
          products = read(products_path)
          for line in (
              '                "Stop" => "正在停止",\n',
              '                "ClearCacheRestart" => "正在清理缓存并重启",\n',
              '                "Stop" => await _tomcatInstanceManager.StopAsync(item.ProductId),\n',
              '                "ClearCacheRestart" => await _tomcatInstanceManager.ClearCacheAndRestartAsync(item.ProductId),\n'):
              if line not in products:
                  raise RuntimeError(f'{products_path}: expected dispatch line missing: {line.strip()}')
              products = products.replace(line, '', 1)
          write(products_path, products)

          # 3) Remove the dedicated cache-clean-and-restart backend entirely.
          manager_path = 'TomcatProductInstanceManager.cs'
          manager = read(manager_path)
          pattern = r'''\n    public async Task<string> ClearCacheAndRestartAsync\(string productId, CancellationToken cancellationToken = default\)\s*\{.*?\n    \}\n\n(?=    public async Task<string> StartAsync)'''
          manager, count = re.subn(pattern, '\n', manager, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'{manager_path}: failed to remove ClearCacheAndRestartAsync')
          write(manager_path, manager)

          # 4) Remove view-model properties that existed only for the deleted buttons.
          vm_path = 'ViewModels/ProductViewModels.cs'
          vm = read(vm_path)
          vm = re.sub(r'^\s*OnPropertyChanged\(nameof\(CanStopTomcatProduct\)\);\s*$', '', vm, flags=re.M)
          vm = re.sub(r'^\s*OnPropertyChanged\(nameof\(CanRestartTomcatProduct\)\);\s*$', '', vm, flags=re.M)
          vm = re.sub(r'^\s*OnPropertyChanged\(nameof\(CanClearTomcatCache\)\);\s*$', '', vm, flags=re.M)
          vm = re.sub(r'^    public bool CanStopTomcatProduct =>.*?;\s*$', '', vm, flags=re.M)
          vm = re.sub(r'^    public bool CanRestartTomcatProduct =>.*?;\s*$', '', vm, flags=re.M)
          vm = re.sub(r'^    public bool CanClearTomcatCache =>.*?;\s*$', '', vm, flags=re.M)
          vm = re.sub(r'^    public bool CanClearCacheAndRestartTomcatProduct =>.*?;\s*$', '', vm, flags=re.M)
          write(vm_path, vm)

          # 5) Update regression coverage to assert permanent removal of these actions.
          test_path = 'MCPanel.Tests/ReliabilityTests.TomcatDebug137.cs'
          tests = read(test_path)
          start = tests.index('    [TestMethod]\n    public void TomcatDebug_ProductManagement_RemovesRetiredActionsAndBackends()')
          end = tests.index('    private static string ReadRepositoryFile', start)
          replacement = '''    [TestMethod]
    public void TomcatDebug_ProductManagement_KeepsOnlyCoreStartAndLogActions()
    {
        var xaml = ReadRepositoryFile(Path.Combine("Resources", "MainWindowTemplates.xaml"));
        var products = ReadRepositoryFile("MainWindow.Products.cs");
        var manager = ReadRepositoryFile("TomcatProductInstanceManager.cs");
        var viewModel = ReadRepositoryFile(Path.Combine("ViewModels", "ProductViewModels.cs"));

        StringAssert.Contains(xaml, "Content=\\\"单独启动\\\"");
        StringAssert.Contains(xaml, "Content=\\\"以 Catalina 方式启动\\\"");
        StringAssert.Contains(xaml, "Content=\\\"查看日志\\\"");
        Assert.IsFalse(xaml.Contains("Content=\\\"停止应用\\\"", StringComparison.Ordinal));
        Assert.IsFalse(xaml.Contains("Content=\\\"清理缓存并重启\\\"", StringComparison.Ordinal));
        Assert.IsFalse(xaml.Contains("Content=\\\"重启应用\\\"", StringComparison.Ordinal));
        Assert.IsFalse(xaml.Contains("Content=\\\"实例目录\\\"", StringComparison.Ordinal));
        Assert.IsFalse(xaml.Contains("Content=\\\"清理 work/temp\\\"", StringComparison.Ordinal));

        Assert.IsFalse(products.Contains("\\\"Stop\\\" =>", StringComparison.Ordinal));
        Assert.IsFalse(products.Contains("ClearCacheRestart", StringComparison.Ordinal));
        Assert.IsFalse(products.Contains("ClearCacheAndRestartAsync", StringComparison.Ordinal));
        StringAssert.Contains(products, "\\\"Start\\\" => await _tomcatInstanceManager.StartAsync");
        StringAssert.Contains(products, "\\\"Catalina\\\" => await _tomcatInstanceManager.StartAsync");

        Assert.IsFalse(manager.Contains("ClearCacheAndRestartAsync(", StringComparison.Ordinal));
        Assert.IsFalse(viewModel.Contains("CanRestartTomcatProduct", StringComparison.Ordinal));
        Assert.IsFalse(viewModel.Contains("CanClearTomcatCache", StringComparison.Ordinal));
        Assert.IsFalse(viewModel.Contains("CanClearCacheAndRestartTomcatProduct", StringComparison.Ordinal));

        // StopAsync stays intentionally: uninstall/global lifecycle paths rely on it,
        // but it is no longer exposed as a product-management button.
        StringAssert.Contains(manager, "public async Task<string> StopAsync(");
    }

'''
          tests = tests[:start] + replacement + tests[end:]
          write(test_path, tests)

          # 6) Bump version.
          project_path = 'MCPanel.csproj'
          project = read(project_path)
          for old, new in (
              ('<Version>1.3.11</Version>', '<Version>1.3.12</Version>'),
              ('<FileVersion>1.3.11.0</FileVersion>', '<FileVersion>1.3.12.0</FileVersion>'),
              ('<AssemblyVersion>1.3.11.0</AssemblyVersion>', '<AssemblyVersion>1.3.12.0</AssemblyVersion>')):
              if old not in project:
                  raise RuntimeError(f'{project_path}: expected version token missing: {old}')
              project = project.replace(old, new, 1)
          write(project_path, project)

          # Final static audit.
          checks = {
              xaml_path: ('Content="停止应用"', 'Content="清理缓存并重启"'),
              products_path: ('"Stop" =>', 'ClearCacheRestart', 'ClearCacheAndRestartAsync'),
              manager_path: ('ClearCacheAndRestartAsync(',),
              vm_path: ('CanRestartTomcatProduct', 'CanClearTomcatCache', 'CanClearCacheAndRestartTomcatProduct'),
          }
          for path, forbidden in checks.items():
              text = read(path)
              for token in forbidden:
                  if token in text:
                      raise RuntimeError(f'{path}: retired token still present: {token}')
          if 'Content="单独启动"' not in read(xaml_path) or 'Content="以 Catalina 方式启动"' not in read(xaml_path) or 'Content="查看日志"' not in read(xaml_path):
              raise RuntimeError('A retained Tomcat management action was accidentally removed')
          if 'public async Task<string> StopAsync(' not in read(manager_path):
              raise RuntimeError('StopAsync backend required by uninstall/global lifecycle was accidentally removed')
          '@ | Set-Content -LiteralPath '_trim_tomcat.py' -Encoding utf8
          python .\_trim_tomcat.py
          Remove-Item -LiteralPath '_trim_tomcat.py' -Force

      - name: Test and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Publish-WinX64.ps1 failed.' }
          "MCPANEL_PUBLISH_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Commit source cleanup
        id: commit
        shell: pwsh
        run: |
          git config user.name 'Xiangming'
          git config user.email '40314529+vguangshen@users.noreply.github.com'
          git add -A
          git commit -m "Release MCPanel 1.3.12" -m "Remove the product-level Stop action and the cache-clean-and-restart capability from UI, dispatch, view-model state, and dedicated backend code. Keep StopAsync only for uninstall and global Tomcat lifecycle safety."
          git push origin HEAD:main
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build update assets
        shell: pwsh
        run: |
          $updatesDir = Join-Path $env:RUNNER_TEMP 'MCPanelUpdates'
          & .\Build-UpdatePackage.ps1 `
            -Version '1.3.12' `
            -PublishDirectory $env:MCPANEL_PUBLISH_DIR `
            -OutputDirectory $updatesDir `
            -GitHubRelease `
            -ReleaseNotes '继续精简 Java/Tomcat 产品管理：删除“停止应用”和“清理缓存并重启”按钮及对应产品级代码；保留停止底层能力仅供卸载和全局 Tomcat 生命周期安全使用。'
          "MCPANEL_UPDATES_DIR=$updatesDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release 1.3.12
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '1.3.12'
          $tag = "v$version"
          $zip = Join-Path $env:MCPANEL_UPDATES_DIR "MCPanel-$version.zip"
          $hash = "$zip.sha256"
          $manifest = Join-Path $env:MCPANEL_UPDATES_DIR 'update-manifest.json'
          $notes = @"
          本版本进一步精简 Java/Tomcat 产品管理区域。

          - 删除“停止应用”按钮及产品管理分发逻辑。
          - 删除“清理缓存并重启”按钮、状态绑定、分发逻辑和 ClearCacheAndRestartAsync 专用后端实现。
          - 保留“单独启动”“以 Catalina 方式启动”“查看日志”。
          - StopAsync 底层停止能力仍保留，仅用于产品卸载、Tomcat 总服务切换和安全清理等内部生命周期场景，不再作为产品管理按钮暴露。
          - 继续保留 IIS 管理、修复绑定、域名与 SSL、卸载等非 Tomcat 运行操作。
          - 发布前执行完整测试与 Win-x64 publish。
          "@
          gh release create $tag $zip $hash $manifest `
            --target '${{ steps.commit.outputs.sha }}' `
            --title "MCPanel $version" `
            --notes $notes
