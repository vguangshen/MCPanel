name: One-time unified modal UI 1.3.15

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-release:
    if: contains(github.event.head_commit.message, '[modal-ui-1.3.15]')
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by the vendored SharpSvn build.'
          }

      - name: Apply modal UI migration
        shell: pwsh
        run: .\tools\Apply-ModalUi-1.3.15.ps1

      - name: Fix generated XAML quoting
        shell: pwsh
        run: .\tools\Fix-ModalUi-1.3.15.ps1

      - name: Run full regression suite
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) {
            throw "Regression tests failed with exit code $LASTEXITCODE."
          }

      - name: Validate Win-x64 publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish115'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'MCPanel.exe'))) {
            throw 'Win-x64 publish did not produce MCPanel.exe.'
          }
          "MCPANEL_PUBLISH_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build update assets
        shell: pwsh
        run: |
          $updatesDir = Join-Path $env:RUNNER_TEMP 'MCPanelUpdates115'
          & .\Build-UpdatePackage.ps1 `
            -Version '1.3.15' `
            -PublishDirectory $env:MCPANEL_PUBLISH_DIR `
            -OutputDirectory $updatesDir `
            -GitHubRelease `
            -ReleaseNotes '统一业务弹窗为 820x600 模态卡片与黑色聚焦遮罩；保留各业务内容特色，安装部署进度同步采用同一外壳，下载队列悬浮 Popup 保持原样。'
          "MCPANEL_UPDATES_DIR=$updatesDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Commit validated 1.3.15 source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/modal-ui-1.3.15.yml' -Force
          Remove-Item -LiteralPath 'tools/Apply-ModalUi-1.3.15.ps1' -Force
          Remove-Item -LiteralPath 'tools/Fix-ModalUi-1.3.15.ps1' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Release MCPanel 1.3.15`n`nUnify all MCPanel-owned business dialogs around one 820x600 modal card and a #78000000 focus scrim. Keep business-specific content layouts, migrate the installation/deployment overlay and MySQL editors, and leave the download queue popup unchanged."
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to commit validated MCPanel 1.3.15 source.'
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to push MCPanel 1.3.15 to main.'
          }
          "MCPANEL_RELEASE_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '1.3.15'
          $tag = "v$version"
          $zip = Join-Path $env:MCPANEL_UPDATES_DIR "MCPanel-$version.zip"
          $hash = "$zip.sha256"
          $manifest = Join-Path $env:MCPANEL_UPDATES_DIR 'update-manifest.json'
          $notes = @"
          本版本统一 MCPanel 自有业务弹窗的视觉与模态交互。

          - 自定义提示/确认框、IIS 网站配置、产品域名与 SSL、Nginx 反向代理管理、MySQL 端口/密码编辑统一为 820×600 模态卡片。
          - 所有 MCPanel 自有业务弹窗统一使用无系统标题栏、圆角、阴影与 #78000000 黑色聚焦遮罩。
          - 弹窗仍保留各自业务特色：消息图标与风险状态、IIS/Nginx 标识、规则计数、证书与数据库字段布局等。
          - 产品安装/更新/卸载进度遮罩同步改用同一 820×600 外壳，下载和安装流程逻辑不变。
          - 下载队列悬浮 Popup 完全保留原有布局与交互，不纳入模态系统。
          - Windows 原生文件/文件夹选择器继续使用系统界面，不伪造自定义文件管理器。
          - 新增回归检查，禁止业务 XAML 弹窗重新退回普通 Window 外壳，并防止 MySQL 临时小窗复活。
          - 完整回归测试和 Win-x64 publish 在发布前通过。
          "@
          gh release create $tag $zip $hash $manifest `
            --target $env:MCPANEL_RELEASE_SHA `
            --title "MCPanel $version" `
            --notes $notes
