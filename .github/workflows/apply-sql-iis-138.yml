name: Apply SQL IIS 1.3.8 patch

on:
  push:
    branches:
      - fix/1.3.8-sql-iis-reliability
    paths:
      - .github/workflows/apply-sql-iis-138.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/1.3.8-sql-iis-reliability

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install VC++ runtime dependencies.' }

      - name: Apply patch
        shell: pwsh
        run: python .github/scripts/patch_sql_iis_138.py

      - name: Verify protected product download chain unchanged
        shell: pwsh
        run: git diff --exit-code origin/main -- McPanelStoreClient.cs SvnProductTransferService.cs DownloadService.cs

      - name: Test and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish138'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SqlServerReleaseCatalog.cs EnvironmentInstaller.cs EnvironmentInstallWorker.cs ViewModels/EnvironmentViewModels.cs Resources/MainWindowTemplates.xaml MCPanel.Tests/ReliabilityTests.SqlIis138.cs MCPanel.csproj
          if (git diff --cached --quiet) { throw 'Patch produced no changes.' }
          git commit -m 'fix: harden SQL Server and IIS installation'
          git push origin HEAD:fix/1.3.8-sql-iis-reliability
