name: One-time user simplifications 1.3.37

# Validation retry: full Tomcat service-state decoupling plus SCM timing fallback.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-user-simplifications-1.3.37.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by SharpSvn.'
          }

      - name: Apply requested simplifications
        shell: pwsh
        run: .\tools\Apply-UserSimplifications-1.3.37.ps1

      - name: Apply validation fixes
        shell: pwsh
        run: .\tools\Fix-UserSimplifications-1.3.37.ps1

      - name: Apply Tomcat service decoupling audit fixes
        shell: pwsh
        run: .\tools\Fix-TomcatServiceDecoupling-1.3.37.ps1

      - name: Apply Tomcat SCM timing fallback fixes
        shell: pwsh
        run: .\tools\Fix-TomcatServiceFallback-1.3.37.ps1

      - name: Run full regression tests
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) {
            throw "Regression tests failed with exit code $LASTEXITCODE."
          }

      - name: Validate Win-x64 publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish137'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) {
            throw "Win-x64 publish failed with exit code $LASTEXITCODE."
          }

      - name: Commit validated 1.3.37 source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-user-simplifications-1.3.37.yml' -Force
          Remove-Item -LiteralPath 'tools/Apply-UserSimplifications-1.3.37.ps1' -Force
          Remove-Item -LiteralPath 'tools/Fix-UserSimplifications-1.3.37.ps1' -Force
          Remove-Item -LiteralPath 'tools/Fix-TomcatServiceDecoupling-1.3.37.ps1' -Force
          Remove-Item -LiteralPath 'tools/Fix-TomcatServiceFallback-1.3.37.ps1' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Release MCPanel 1.3.37`n`nFully decouple Tomcat runtime state from SCM Running/Stopped status, add process-based fallback for SCM timing failures, remove startup progress probing, remove duplicate AI model-setting buttons, and restore the full website card view while keeping platform/status filters."
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to commit validated MCPanel 1.3.37 source.'
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to push MCPanel 1.3.37 to main.'
          }
