name: One-time Catalina no-readiness 1.3.39

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.head_commit.message != 'Validate Catalina no-readiness 1.3.39'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Apply Catalina no-readiness fix
        shell: pwsh
        run: |
          & .\Apply-Catalina-NoReadiness-1.3.39.ps1

      - name: Full regression tests and Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated 1.3.39 source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.\Apply-Catalina-NoReadiness-1.3.39.ps1' -Force
          Remove-Item -LiteralPath '.\.github\workflows\one-time-catalina-no-readiness-1.3.39.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            throw 'Catalina no-readiness workflow produced no changes.'
          }
          git commit -m 'Validate Catalina no-readiness 1.3.39'
          git push origin HEAD:main
