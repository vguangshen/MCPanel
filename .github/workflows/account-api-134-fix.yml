name: Validate Account API 1.3.4 fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by SharpSvn tests.'
          }

      - name: Apply targeted Account API patch
        shell: pwsh
        run: |
          $scriptPath = 'tools\apply-account-api-134-fix.ps1'
          $script = [IO.File]::ReadAllText($scriptPath).Replace("`r`n", "`n")

          $oldExact = @'
          function Replace-Exact([string]$Text, [string]$Old, [string]$New, [string]$Label) {
              if (-not $Text.Contains($Old)) {
                  throw "Patch anchor not found: $Label"
              }
              return $Text.Replace($Old, $New)
          }
          '@.Trim().Replace("`r`n", "`n")
          $newExact = @'
          function Replace-Exact([string]$Text, [string]$Old, [string]$New, [string]$Label) {
              $Old = $Old.Replace("`r`n", "`n")
              $New = $New.Replace("`r`n", "`n")
              if (-not $Text.Contains($Old)) {
                  throw "Patch anchor not found: $Label"
              }
              return $Text.Replace($Old, $New)
          }
          '@.Trim().Replace("`r`n", "`n")
          if (-not $script.Contains($oldExact)) { throw 'Replace-Exact helper anchor not found.' }
          $script = $script.Replace($oldExact, $newExact)

          $oldRegex = @'
          function Replace-RegexOnce([string]$Text, [string]$Pattern, [string]$Replacement, [string]$Label) {
              $matches = [regex]::Matches($Text, $Pattern)
              if ($matches.Count -ne 1) {
                  throw "Expected exactly one match for $Label, found $($matches.Count)."
              }
              return [regex]::Replace($Text, $Pattern, $Replacement, 1)
          }
          '@.Trim().Replace("`r`n", "`n")
          $newRegex = @'
          function Replace-RegexOnce([string]$Text, [string]$Pattern, [string]$Replacement, [string]$Label) {
              $Replacement = $Replacement.Replace("`r`n", "`n")
              $matches = [regex]::Matches($Text, $Pattern)
              if ($matches.Count -ne 1) {
                  throw "Expected exactly one match for $Label, found $($matches.Count)."
              }
              return [regex]::Replace($Text, $Pattern, $Replacement, 1)
          }
          '@.Trim().Replace("`r`n", "`n")
          if (-not $script.Contains($oldRegex)) { throw 'Replace-RegexOnce helper anchor not found.' }
          $script = $script.Replace($oldRegex, $newRegex)

          # PowerShell variable names are case-insensitive; $Host is reserved.
          $script = $script.Replace('$host = Read-Normalized $hostPath', '$hostText = Read-Normalized $hostPath')
          $script = $script.Replace('$host = Replace-Exact $host', '$hostText = Replace-Exact $hostText')
          $script = $script.Replace('Write-Utf8 $hostPath $host', 'Write-Utf8 $hostPath $hostText')
          [IO.File]::WriteAllText($scriptPath, $script, [Text.UTF8Encoding]::new($false))

          & .\tools\apply-account-api-134-fix.ps1

          $testPath = 'MCPanel.Tests\ReliabilityTests.AccountApiLifecycle.cs'
          $test = [IO.File]::ReadAllText($testPath).Replace("`r`n", "`n")
          if (-not $test.StartsWith('using System.IO;')) {
            $test = "using System.IO;`n" + $test
          }

          # The host creates its persistent identity below AccountApiStorage.RootPath.
          # Real MCPanel startup initializes that directory before constructing the host;
          # reproduce that prerequisite in the focused lifecycle fixture.
          $test = $test.Replace(
            "    public void AccountApiHostReportsRealListenerLifecycle()`n    {",
            "    public void AccountApiHostReportsRealListenerLifecycle()`n    {`n        Directory.CreateDirectory(AccountApiStorage.RootPath);")
          $test = $test.Replace(
            "    public void EmbeddedAccountApiRuntimeCanStopAndImmediatelyRestartSamePort()`n    {",
            "    public void EmbeddedAccountApiRuntimeCanStopAndImmediatelyRestartSamePort()`n    {`n        Directory.CreateDirectory(AccountApiStorage.RootPath);")
          $test = $test.Replace(
            "    public void AccountApiHostFailsOnlyWhenThePortIsActuallyBound()`n    {",
            "    public void AccountApiHostFailsOnlyWhenThePortIsActuallyBound()`n    {`n        Directory.CreateDirectory(AccountApiStorage.RootPath);")

          # TcpListener is not IDisposable on net462.
          $test = $test.Replace(
            '        using var blocker = new TcpListener(IPAddress.Loopback, 0);',
            '        var blocker = new TcpListener(IPAddress.Loopback, 0);')
          $test = $test.Replace(
            '        using var listener = new TcpListener(IPAddress.Loopback, 0);',
            '        var listener = new TcpListener(IPAddress.Loopback, 0);')
          $test = $test.Replace(
            "        finally`n        {`n            host.Dispose();`n        }`n    }`n`n    private static int ReserveFreeTcpPort()",
            "        finally`n        {`n            host.Dispose();`n            blocker.Stop();`n        }`n    }`n`n    private static int ReserveFreeTcpPort()")
          $test = $test.Replace(
            "        listener.Start();`n        return ((IPEndPoint)listener.LocalEndpoint).Port;",
            "        listener.Start();`n        var port = ((IPEndPoint)listener.LocalEndpoint).Port;`n        listener.Stop();`n        return port;")
          [IO.File]::WriteAllText($testPath, $test, [Text.UTF8Encoding]::new($false))

      - name: Guard original product download chain
        shell: pwsh
        run: |
          $forbidden = @(
            'McPanelStoreClient.cs',
            'SvnProductTransferService.cs',
            'DownloadService.cs'
          )
          $changed = @(git diff --name-only HEAD)
          $touched = @($changed | Where-Object { $forbidden -contains $_ })
          if ($touched.Count -gt 0) {
            throw "Account API fix unexpectedly touched product download chain: $($touched -join ', ')"
          }
          Write-Host 'Original product download chain is unchanged.'

      - name: Run tests and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanel134Publish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated fix to integration branch
        shell: pwsh
        run: |
          git checkout 'bec11776678c9cce3bfb039dc1cfe0c91e8c6999' -- '.github/workflows/release.yml'
          Remove-Item -LiteralPath '.github\workflows\account-api-134-fix.yml' -Force
          Remove-Item -LiteralPath 'tools\apply-account-api-134-fix.ps1' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize Account API restart lifecycle [skip ci]'
          git push --force-with-lease origin HEAD:integration/1.3.4-account-api-lifecycle
