             '            product.SetQueueState(item.State, item.QueuePosition);\n            product.IsBusy = false;\n            product.IsDownloadProgressIndeterminate = false;\n            product.StatusText = $"已加入安装队列，等待第 {item.QueuePosition} 项处理。";')
          r1('MainWindow.Products.cs',
