name: Audit .NET and NuGet cache

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-dotnet-runtime.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify preinstalled .NET 10 SDK
        shell: pwsh
        run: |
          $version = (dotnet --version).Trim()
          Write-Host "Selected SDK from global.json: $version"
          if ($version -notmatch '^10\.') {
            throw "MCPanel requires a .NET 10 SDK, but the runner selected $version."
          }

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', '**/nuget.config', '**/NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Measure restore
        shell: pwsh
        run: |
          Write-Host "Cache hit: ${{ steps.nuget-cache.outputs.cache-hit }}"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          dotnet restore .\MCPanel.Tests\MCPanel.Tests.csproj
          $sw.Stop()
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          Write-Host ("Restore elapsed: {0:N2}s" -f $sw.Elapsed.TotalSeconds)
