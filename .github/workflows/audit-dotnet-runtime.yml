name: Audit .NET runner baseline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-dotnet-runtime.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect preinstalled .NET and NuGet state
        shell: pwsh
        run: |
          Write-Host '--- dotnet --info ---'
          dotnet --info
          Write-Host '--- dotnet --list-sdks ---'
          dotnet --list-sdks
          Write-Host '--- dotnet --list-runtimes ---'
          dotnet --list-runtimes
          Write-Host '--- NuGet package root ---'
          $packages = if ([string]::IsNullOrWhiteSpace($env:NUGET_PACKAGES)) {
            Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)) '.nuget\packages'
          } else { $env:NUGET_PACKAGES }
          Write-Host "NUGET_PACKAGES=$packages"
          if (Test-Path -LiteralPath $packages) {
            $count = @(Get-ChildItem -LiteralPath $packages -Directory -ErrorAction SilentlyContinue).Count
            Write-Host "Preinstalled package directory count: $count"
          } else {
            Write-Host 'NuGet package root does not exist yet.'
          }

      - name: Measure cold restore without setup-dotnet
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          dotnet restore .\MCPanel.Tests\MCPanel.Tests.csproj
          $sw.Stop()
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          Write-Host ("Cold restore elapsed: {0:N2}s" -f $sw.Elapsed.TotalSeconds)

      - name: Measure warm restore in same runner
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          dotnet restore .\MCPanel.Tests\MCPanel.Tests.csproj
          $sw.Stop()
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          Write-Host ("Warm restore elapsed: {0:N2}s" -f $sw.Elapsed.TotalSeconds)
