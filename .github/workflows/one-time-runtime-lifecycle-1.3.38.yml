name: One-time runtime lifecycle 1.3.38

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: startsWith(github.event.head_commit.message, 'Apply runtime lifecycle 1.3.38')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply MySQL and Tomcat lifecycle fixes
        shell: pwsh
        run: .\tools\Apply-RuntimeLifecycle-1.3.38.ps1

      - name: Repair generated lifecycle source
        shell: pwsh
        run: |
          $path = 'EnvironmentRuntimeService.cs'
          $text = Get-Content -LiteralPath $path -Raw

          # The one-time transformer changes a generic try/catch shape that also
          # exists in the SQL Server action. Remove that accidental MySQL return
          # block only from the SQL Server section.
          $sqlMarker = '    private static async Task RunSqlServerServiceActionAsync(string action, CancellationToken cancellationToken)'
          $mysqlMarker = '    private static async Task<string> RunMySqlServiceActionAsync(string action, CancellationToken cancellationToken)'
          $sqlStart = $text.IndexOf($sqlMarker, [StringComparison]::Ordinal)
          $mysqlStart = $text.IndexOf($mysqlMarker, [StringComparison]::Ordinal)
          if ($sqlStart -lt 0 -or $mysqlStart -le $sqlStart) { throw 'Unable to locate SQL/MySQL service action sections.' }
          $prefix = $text.Substring(0, $sqlStart)
          $sqlSection = $text.Substring($sqlStart, $mysqlStart - $sqlStart)
          $tail = $text.Substring($mysqlStart)
          $pattern = '(?ms)\r?\n\s*var detail = ReadTextFileBestEffort\(result\);\r?\n\s*return string\.IsNullOrWhiteSpace\(detail\)\r?\n\s*\? \$"MySQL \{action\} 操作已完成。"\r?\n\s*: detail\.Trim\(\);'
          $fixedSqlSection = [regex]::Replace($sqlSection, $pattern, '', 1)
          if ($fixedSqlSection -eq $sqlSection) { throw 'Unable to remove accidental MySQL result block from SQL Server section.' }
          $text = $prefix + $fixedSqlSection + $tail

          # Preserve the existing safety wording expected by regression coverage,
          # while treating credential verification as a warning rather than a
          # service-start failure.
          $oldWarning = ' 注意：服务运行正常，但保存的 root 凭据验证未通过；MCPanel 不会自动重置数据库密码。'
          $newWarning = ' 注意：服务运行正常，但保存的 root 凭据验证未通过。为避免意外修改数据库密码，MCPanel 已停止自动重置；不会修改现有数据库密码。'
          if (-not $text.Contains($oldWarning)) { throw 'Unable to locate MySQL credential warning text.' }
          $text = $text.Replace($oldWarning, $newWarning)

          # Do not depend on catalina.bat stop / shutdown port 8005 for a shared
          # Tomcat restart. If the service stop request did not end the JVM, use
          # the managed CATALINA_BASE process cleanup path instead.
          $oldStop = @'
                          if (TomcatProductInstanceManager.IsSharedTomcatRunning())
                          {
                              var shutdown = Path.Combine(tomcatRoot, "bin", "shutdown.bat");
                              if (File.Exists(shutdown))
                              {
                                  await RunFileAsync(shutdown, string.Empty, Path.Combine(tomcatRoot, "bin"), false, cancellationToken);
                              }
                              for (var attempt = 0; attempt < 80 && TomcatProductInstanceManager.IsSharedTomcatRunning(); attempt++)
                              {
                                  await Task.Delay(250, cancellationToken);
                              }
                              if (TomcatProductInstanceManager.IsSharedTomcatRunning())
                              {
                                  throw new InvalidOperationException("Tomcat Server 共享进程未能停止；为避免影响单应用实例，已取消强制结束全部 Java 进程。");
                              }
                          }
          '@
          $newStop = @'
                          if (TomcatProductInstanceManager.IsSharedTomcatRunning())
                          {
                              await TomcatProductInstanceManager.StopSharedTomcatAsync(cancellationToken);
                              if (TomcatProductInstanceManager.IsSharedTomcatRunning())
                              {
                                  throw new InvalidOperationException("Tomcat Server 共享进程未能停止；单应用实例未受影响。请检查共享 Tomcat Java 进程。");
                              }
                          }
          '@
          if (-not $text.Contains($oldStop)) { throw 'Unable to locate shared Tomcat shutdown.bat stop block.' }
          $text = $text.Replace($oldStop, $newStop)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

          $instancesPath = 'TomcatProductInstanceManager.cs'
          $instances = Get-Content -LiteralPath $instancesPath -Raw
          $marker = '    public static async Task StopAllTomcatProcessesAsync('
          if (-not $instances.Contains($marker)) { throw 'Unable to locate StopAllTomcatProcessesAsync marker.' }
          if (-not $instances.Contains('public static async Task StopSharedTomcatAsync(')) {
            $method = @'
              public static async Task StopSharedTomcatAsync(CancellationToken cancellationToken = default)
              {
                  var tomcatHome = FindTomcatRoot();
                  if (tomcatHome is null)
                  {
                      return;
                  }

                  await RuntimeLock.WaitAsync(cancellationToken);
                  try
                  {
                      await StopCatalinaBaseAsync(tomcatHome, cancellationToken, Array.Empty<int>());
                  }
                  finally
                  {
                      RuntimeLock.Release();
                  }
              }

          '@
            $instances = $instances.Replace($marker, $method + $marker)
          }
          [IO.File]::WriteAllText((Resolve-Path $instancesPath), $instances, (New-Object Text.UTF8Encoding($false)))

          $testPath = 'MCPanel.Tests/ReliabilityTests.RuntimeLifecycle138.cs'
          $tests = Get-Content -LiteralPath $testPath -Raw
          $broadAssertion = '        Assert.IsFalse(runtime.Contains("if (!(Test-RootPassword $paths)) { Fail ''MySQL 已启动", StringComparison.Ordinal));'
          $specificAssertion = '        Assert.IsFalse(runtime.Contains("if (!(Test-RootPassword $paths)) { Fail ''MySQL 已启动，但保存的 root 凭据无法验证", StringComparison.Ordinal));'
          if (-not $tests.Contains($broadAssertion)) { throw 'Unable to locate broad MySQL lifecycle assertion.' }
          $tests = $tests.Replace($broadAssertion, $specificAssertion)

          $testNeedle = '        StringAssert.Contains(runtime, "TomcatProductInstanceManager.IsSharedTomcatRunning()");'
          if (-not $tests.Contains($testNeedle)) { throw 'Unable to locate Tomcat lifecycle assertion.' }
          $testReplacement = $testNeedle + [Environment]::NewLine +
              '        StringAssert.Contains(runtime, "StopSharedTomcatAsync(cancellationToken)");' + [Environment]::NewLine +
              '        var instances = ReadRepositoryFile("TomcatProductInstanceManager.cs");' + [Environment]::NewLine +
              '        StringAssert.Contains(instances, "public static async Task StopSharedTomcatAsync");'
          $tests = $tests.Replace($testNeedle, $testReplacement)
          [IO.File]::WriteAllText((Resolve-Path $testPath), $tests, (New-Object Text.UTF8Encoding($false)))

          Add-Content -LiteralPath 'RELEASE-NOTES.md' -Encoding UTF8 -Value '- 修复 Tomcat 已完全运行后点击“重启”偶发无法停止的问题：不再依赖可能未监听的 8005 shutdown 端口；共享 Tomcat 停止改为按 CATALINA_BASE 精确结束共享 Java 进程，并保持单应用实例不受影响。'

      - name: Full regression tests
        shell: pwsh
        run: dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release --nologo

      - name: Win-x64 publish validation
        shell: pwsh
        run: .\Publish-WinX64.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'MCPanelPublish138')

      - name: Commit validated 1.3.38 source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-runtime-lifecycle-1.3.38.yml tools/Apply-RuntimeLifecycle-1.3.38.ps1
          git add -A
          git commit -m "Fix MySQL and Tomcat lifecycle for 1.3.38"
          git push origin HEAD:main
