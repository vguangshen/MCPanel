name: Fix and validate 1.3.8 release UI timeout

on:
  push:
    branches:
      - fix/1.3.8-release-ui-test-timeout
    paths:
      - .github/workflows/fix-release-ui-timeout-138.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/1.3.8-release-ui-test-timeout

      - name: Stabilize settings-page UI test timeout
        shell: pwsh
        run: |
          $path = 'MCPanel.Tests/ReliabilityTests.Ui.cs'
          $text = Get-Content -LiteralPath $path -Raw
          $old = @'
        thread.SetApartmentState(ApartmentState.STA);
        thread.Start();

        Assert.IsTrue(completed.Wait(TimeSpan.FromSeconds(20)), "设置页布局与开关渲染测试超时。");
'@
          $new = @'
        thread.SetApartmentState(ApartmentState.STA);
        thread.IsBackground = true;
        thread.Start();

        Assert.IsTrue(completed.Wait(TimeSpan.FromSeconds(60)), "设置页布局与开关渲染测试超时。");
'@
          $normalized = $text -replace "`r`n", "`n"
          if (-not $normalized.Contains($old)) { throw 'Target settings-page UI timeout block was not found exactly once.' }
          if (($normalized.Split($old).Count - 1) -ne 1) { throw 'Target settings-page UI timeout block matched more than once.' }
          $normalized = $normalized.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), ($normalized -replace "`n", "`r`n"), [Text.UTF8Encoding]::new($false))

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install VC++ runtime dependencies.' }

      - name: Repeat flaky UI test
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "UI stability run $_/3"
            dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --filter "FullyQualifiedName~SettingsPagePlacesThemeAfterDatabaseToolsAndUsesCompactSwitch" --no-restore
            if ($LASTEXITCODE -ne 0) { throw "UI stability run $_ failed." }
          }

      - name: Full reliability tests and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish138ReleaseFix'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Full publish validation failed.' }

      - name: Commit stabilized test
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add MCPanel.Tests/ReliabilityTests.Ui.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'No test stabilization change to commit.' }
          git commit -m "test: stabilize 1.3.8 release UI rendering check"
          git push origin HEAD:fix/1.3.8-release-ui-test-timeout
