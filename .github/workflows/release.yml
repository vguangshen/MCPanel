# Standard MCPanel release pipeline
name: Release MCPanel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release MCPanel ')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ensure SharpSvn VC++ 2010 runtime
        shell: pwsh
        run: |
          # The vendored SharpSvn 1.8009.3299.43 x64 binary and SharpPlink
          # import MSVCR100.dll. Do not install unrelated VC++ generations.
          $runtime = Join-Path $env:WINDIR 'System32\MSVCR100.dll'
          if (Test-Path -LiteralPath $runtime) {
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime).FileVersion
            Write-Host "SharpSvn runtime already available: $runtime ($version)."
            exit 0
          }

          Write-Host 'MSVCR100.dll is missing; installing only the VC++ 2010 redistributable.'
          choco install vcredist2010 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ 2010 runtime required by the vendored SharpSvn build."
          }
          if (-not (Test-Path -LiteralPath $runtime)) {
            throw "VC++ 2010 installation completed but the required x64 runtime is still missing: $runtime"
          }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime).FileVersion
          Write-Host "SharpSvn runtime installed: $runtime ($version)."

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'MCPanel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'MCPanel.csproj does not define Version.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Test and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          "MCPANEL_PUBLISH_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build update assets
        shell: pwsh
        run: |
          $updatesDir = Join-Path $env:RUNNER_TEMP 'MCPanelUpdates'
          & .\Build-UpdatePackage.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -PublishDirectory $env:MCPANEL_PUBLISH_DIR `
            -OutputDirectory $updatesDir `
            -GitHubRelease `
            -ReleaseNotes (Get-Content -LiteralPath 'RELEASE-NOTES.md' -Raw)
          "MCPANEL_UPDATES_DIR=$updatesDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $zip = Join-Path $env:MCPANEL_UPDATES_DIR "MCPanel-$version.zip"
          $hash = "$zip.sha256"
          $manifest = Join-Path $env:MCPANEL_UPDATES_DIR 'update-manifest.json'
          gh release create $tag $zip $hash $manifest `
            --target '${{ github.sha }}' `
            --title "MCPanel $version" `
            --notes-file RELEASE-NOTES.md
