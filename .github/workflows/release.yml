# Standard MCPanel release pipeline
name: Release MCPanel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release MCPanel ')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify preinstalled .NET 10 SDK
        shell: pwsh
        run: |
          $version = (dotnet --version).Trim()
          Write-Host "Selected SDK from global.json: $version"
          if ($version -notmatch '^10\.') {
            throw "MCPanel requires a .NET 10 SDK, but the runner selected $version."
          }

      - name: Compute NuGet dependency fingerprint
        id: nuget-key
        shell: pwsh
        run: |
          $entries = [System.Collections.Generic.List[string]]::new()
          $projectRoot = (Get-Location).Path
          $projects = Get-ChildItem -Path $projectRoot -Filter '*.csproj' -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
            Sort-Object FullName

          foreach ($file in $projects) {
            [xml]$project = Get-Content -LiteralPath $file.FullName -Raw
            $relative = $file.FullName.Substring($projectRoot.Length).TrimStart('\', '/')

            foreach ($group in @($project.Project.PropertyGroup)) {
              foreach ($name in @('TargetFramework', 'TargetFrameworks')) {
                $value = [string]$group.$name
                if (-not [string]::IsNullOrWhiteSpace($value)) {
                  $entries.Add("$relative|$name|$($value.Trim())")
                }
              }
            }

            foreach ($group in @($project.Project.ItemGroup)) {
              foreach ($reference in @($group.PackageReference)) {
                if ($null -eq $reference) { continue }
                $include = [string]$reference.Include
                $update = [string]$reference.Update
                $version = [string]$reference.Version
                $entries.Add("$relative|PackageReference|$include|$update|$version")
              }
              foreach ($packageVersion in @($group.PackageVersion)) {
                if ($null -eq $packageVersion) { continue }
                $include = [string]$packageVersion.Include
                $update = [string]$packageVersion.Update
                $version = [string]$packageVersion.Version
                $entries.Add("$relative|PackageVersion|$include|$update|$version")
              }
            }
          }

          if (Test-Path -LiteralPath 'global.json') {
            $entries.Add('global.json|' + (Get-Content -LiteralPath 'global.json' -Raw).Trim())
          }
          Get-ChildItem -Path $projectRoot -File -Recurse |
            Where-Object { $_.Name -ieq 'NuGet.Config' -and $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring($projectRoot.Length).TrimStart('\', '/')
              $entries.Add("$relative|" + (Get-Content -LiteralPath $_.FullName -Raw).Trim())
            }

          $canonical = (($entries | Sort-Object) -join "`n")
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [Text.Encoding]::UTF8.GetBytes($canonical)
            $hash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha.Dispose()
          }
          Write-Host "NuGet dependency fingerprint: $hash"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ steps.nuget-key.outputs.hash }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Ensure SharpSvn VC++ 2010 runtime
        shell: pwsh
        run: |
          # The vendored SharpSvn 1.8009.3299.43 x64 binary and SharpPlink
          # import MSVCR100.dll. Do not install unrelated VC++ generations.
          $runtime = Join-Path $env:WINDIR 'System32\MSVCR100.dll'
          if (Test-Path -LiteralPath $runtime) {
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime).FileVersion
            Write-Host "SharpSvn runtime already available: $runtime ($version)."
            exit 0
          }

          Write-Host 'MSVCR100.dll is missing; installing only the VC++ 2010 redistributable.'
          choco install vcredist2010 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ 2010 runtime required by the vendored SharpSvn build."
          }
          if (-not (Test-Path -LiteralPath $runtime)) {
            throw "VC++ 2010 installation completed but the required x64 runtime is still missing: $runtime"
          }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime).FileVersion
          Write-Host "SharpSvn runtime installed: $runtime ($version)."

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'MCPanel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'MCPanel.csproj does not define Version.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Test and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          "MCPANEL_PUBLISH_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build update assets
        shell: pwsh
        run: |
          $updatesDir = Join-Path $env:RUNNER_TEMP 'MCPanelUpdates'
          & .\Build-UpdatePackage.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -PublishDirectory $env:MCPANEL_PUBLISH_DIR `
            -OutputDirectory $updatesDir `
            -GitHubRelease `
            -ReleaseNotes (Get-Content -LiteralPath 'RELEASE-NOTES.md' -Raw)
          "MCPANEL_UPDATES_DIR=$updatesDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $zip = Join-Path $env:MCPANEL_UPDATES_DIR "MCPanel-$version.zip"
          $hash = "$zip.sha256"
          $manifest = Join-Path $env:MCPANEL_UPDATES_DIR 'update-manifest.json'
          gh release create $tag $zip $hash $manifest `
            --target '${{ github.sha }}' `
            --title "MCPanel $version" `
            --notes-file RELEASE-NOTES.md
