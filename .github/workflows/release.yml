name: Release MCPanel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release MCPanel ')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'MCPanel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'MCPanel.csproj does not define Version.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Test and publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          "MCPANEL_PUBLISH_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build update assets
        shell: pwsh
        run: |
          $updatesDir = Join-Path $env:RUNNER_TEMP 'MCPanelUpdates'
          & .\Build-UpdatePackage.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -PublishDirectory $env:MCPANEL_PUBLISH_DIR `
            -OutputDirectory $updatesDir `
            -GitHubRelease `
            -ReleaseNotes '提升 SQL Server 与 IIS 安装可靠性：按微软兼容矩阵限制可选 SQL Server 版本、优化 4KB/NVMe 与损坏实例恢复、修复 IIS ASP.NET/重启续装链路；保留原版 Store PendingFileRenameOperations 行为与产品下载链路。'
          "MCPANEL_UPDATES_DIR=$updatesDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $zip = Join-Path $env:MCPANEL_UPDATES_DIR "MCPanel-$version.zip"
          $hash = "$zip.sha256"
          $manifest = Join-Path $env:MCPANEL_UPDATES_DIR 'update-manifest.json'
          $notes = @"
          本版本重点提升 SQL Server 与 IIS 安装、恢复和系统兼容性判断的可靠性，不改变原有产品下载链路。

          - SQL Server 版本选择按 Microsoft 官方 Windows / SQL Server 兼容矩阵判断；不受支持的版本继续显示但禁用并给出原因。
          - 如果无法可靠识别当前 Windows 版本，则不猜测系统代际，所有 SQL Server 版本选项保持开放。
          - 保留原版 ITMC Store 在 SQL Server 安装前直接删除 PendingFileRenameOperations 的兼容行为。
          - SQL Server 2012 Express 改为仅请求数据库引擎，避免 SQLEXPR 安装包与 Tools 功能参数不匹配。
          - 现代 SQL Server 安装不再强制关闭 Setup 更新行为。
          - 4KB/NVMe 兼容处理改为先检测实际物理扇区，仅在大于 4KB 时写入 Microsoft 官方 ForcedPhysicalSectorSizeInBytes 兼容项并要求重启。
          - SQL Server 损坏默认实例恢复改为实例级清理，避免默认删除其他实例和共享 SQL Server 组件。
          - IIS 使用 Windows Optional Features 安装 ASP.NET，不再在现代 Windows 上调用 aspnet_regiis -i。
          - IIS 与 URL Rewrite 的重启需求支持续装，并在完成前验证 RewriteModule、WAS 与 W3SVC。
          - 旧版 .NET / IIS 兼容组件采用尽力安装策略，缺少旧 payload 时不阻断现代 IIS 主安装链路。
          - 稳定设置页 WPF 渲染测试在繁忙 CI Runner 上的等待时间，避免偶发 20 秒超时阻断正式发布。
          - 发布前执行完整可靠性测试，136 项测试全部通过。
          "@
          gh release create $tag $zip $hash $manifest `
            --target '${{ github.sha }}' `
            --title "MCPanel $version" `
            --notes $notes
