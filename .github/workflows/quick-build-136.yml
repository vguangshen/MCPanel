name: Quick build 1.3.6

on:
  push:
    branches:
      - fix/1.3.6-service-autostart

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile
        shell: pwsh
        run: dotnet build .\MCPanel.csproj -c Release
