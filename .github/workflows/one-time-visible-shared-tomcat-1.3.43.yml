name: One-time visible shared Tomcat 1.3.43
# Retry after updating the two stale shared-Tomcat regression contracts; both Catalina entry points remain required.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-visible-shared-tomcat-1.3.43.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by the vendored SharpSvn build.'
          }

      - name: Apply visible shared Tomcat changes
        shell: pwsh
        run: .\tools\Fix-VisibleSharedTomcat-1.3.43-v3.ps1

      - name: Full regression tests
        shell: pwsh
        run: dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj --configuration Release --logger "trx;LogFileName=regression.trx" --results-directory .\TestResults

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-1.3.43
          path: .\TestResults\regression.trx
          if-no-files-found: warn
          retention-days: 1

      - name: Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish143'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated 1.3.43 source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.\tools\Fix-VisibleSharedTomcat-1.3.43.ps1' -Force
          Remove-Item -LiteralPath '.\tools\Fix-VisibleSharedTomcat-1.3.43-v2.ps1' -Force
          Remove-Item -LiteralPath '.\tools\Fix-VisibleSharedTomcat-1.3.43-v3.ps1' -Force
          Remove-Item -LiteralPath '.\.github\workflows\one-time-visible-shared-tomcat-1.3.43.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release MCPanel 1.3.43'
          git push origin HEAD:main
