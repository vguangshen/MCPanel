name: One-time Tomcat stop and website probe fix 1.3.42

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-tomcat-stop-probe-1.3.42.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by the vendored SharpSvn build.'
          }

      - name: Apply Tomcat stop and website probe fixes
        shell: pwsh
        run: .\tools\Fix-TomcatStop-AndRemoveProbe-1.3.42.ps1

      - name: Remove website status monitoring
        shell: pwsh
        run: .\tools\Fix-WebsiteStatus-AndProbeProxy-1.3.42.ps1

      - name: Full regression tests
        shell: pwsh
        run: dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj --configuration Release

      - name: Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish142'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated 1.3.42 source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.\tools\Fix-TomcatStop-AndRemoveProbe-1.3.42.ps1' -Force
          Remove-Item -LiteralPath '.\tools\Fix-WebsiteStatus-AndProbeProxy-1.3.42.ps1' -Force
          Remove-Item -LiteralPath '.\.github\workflows\one-time-tomcat-stop-probe-1.3.42.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release MCPanel 1.3.42'
          git push origin HEAD:main
