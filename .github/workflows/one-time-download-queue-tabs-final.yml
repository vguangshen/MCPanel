name: One-time download queue tabs redesign final

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-download-queue-tabs-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply final redesign
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # Reuse the reviewed redesign + regression patch from the previous one-time workflow.
          workflow = Path('.github/workflows/one-time-download-queue-tabs-retry.yml').read_text(encoding='utf-8-sig').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "@'")
          end = next(i for i, line in enumerate(workflow[start + 1:], start + 1) if line.strip() == "'@ | python -")
          lines = [line[10:] if line.startswith('          ') else line for line in workflow[start + 1:end]]
          script = '\n'.join(lines) + '\n'
          exec(compile(script, 'download-queue-tabs-final-patch.py', 'exec'))

          # The MainWindow queue monitor ticks every second. The UI test injects synthetic
          # rows directly, so stop that monitor after Loaded before asserting the active view.
          ui_path = Path('MCPanel.Tests/ReliabilityTests.Ui.cs')
          ui = ui_path.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          method_start = ui.index('    public void DownloadQueuePopupTemplateRendersReadOnlyQueueRows()')
          method_end = ui.index('    [TestMethod]\n    public void DownloadQueuePopupDeleteActionReachesMainWindowQueueService()', method_start)
          segment = ui[method_start:method_end]
          old = '''                      window.Show();
                      window.UpdateLayout();
          '''
          new = '''                      window.Show();
                      var queueTimer = typeof(MainWindow)
                          .GetField("_timer", System.Reflection.BindingFlags.Instance | System.Reflection.BindingFlags.NonPublic)?
                          .GetValue(window) as DispatcherTimer;
                      queueTimer?.Stop();
                      window.UpdateLayout();
          '''
          if old not in segment:
              raise RuntimeError('render regression window.Show anchor not found')
          segment = segment.replace(old, new, 1)
          ui = ui[:method_start] + segment + ui[method_end:]
          ui_path.write_text(ui, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Validate diff
        shell: pwsh
        run: git diff --check

      - name: Test download queue regressions
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --filter "FullyQualifiedName~DownloadQueue"

      - name: Test remaining suite
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName!~DownloadQueue&FullyQualifiedName!~ComponentStorageMigrationMovesLegacyDirectoriesWithoutOverwritingCache"

      - name: Commit feature
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.Products.cs ViewModels/ProductViewModels.cs Resources/MainWindowTemplates.xaml MCPanel.Tests/ReliabilityTests.DownloadQueueTabs.cs MCPanel.Tests/ReliabilityTests.Ui.cs MCPanel.Tests/ReliabilityTests.DownloadQueueUiFix.cs
          git commit -m "feat: split download queue into active and completed tabs"
          git push origin main
