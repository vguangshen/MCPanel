name: One-time Tomcat start mode split 1.3.50

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-test-release:
    if: github.event.head_commit.message == 'Add Tomcat start-mode split migration 1.3.50'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by SharpSvn.'
          }

      - name: Apply Tomcat start mode split
        shell: pwsh
        run: |
          & .\tools\Split-TomcatStartModes-1.3.50.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full regression tests
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'MCPanelRegression150'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release --logger "trx;LogFileName=regression.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Initial regression run failed; retrying once to exclude runner timing flakes.'
            dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release --logger "trx;LogFileName=regression-retry.trx" --results-directory $results
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate Win-x64 publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish150'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'MCPanel.exe'))) {
            throw 'Win-x64 publish did not produce MCPanel.exe.'
          }

      - name: Commit validated 1.3.50 source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- '.github/workflows/one-time-tomcat-start-mode-split-1.3.50.yml'
          git rm -- 'tools/Split-TomcatStartModes-1.3.50.ps1'
          git add --all
          git commit -m "Release MCPanel 1.3.50`n`nSeparate normal Tomcat start/restart from explicit Catalina run mode. Normal Start and Restart now use startup.bat start semantics while CatalinaRun remains a foreground diagnostic console."
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to commit validated MCPanel 1.3.50 source.'
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to push MCPanel 1.3.50 to main.'
          }
