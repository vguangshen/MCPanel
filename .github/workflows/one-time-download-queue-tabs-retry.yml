name: One-time download queue tabs redesign retry

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-download-queue-tabs-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply corrected redesign and regressions
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from textwrap import dedent, indent

          # Reuse the already-reviewed production patch body, correcting the raw test-string preamble.
          workflow = Path('.github/workflows/one-time-download-queue-tabs.yml').read_text(encoding='utf-8-sig').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "@'")
          end = next(i for i, line in enumerate(workflow[start + 1:], start + 1) if line.strip() == "'@ | python -")
          lines = [line[10:] if line.startswith('          ') else line for line in workflow[start + 1:end]]
          script = '\n'.join(lines) + '\n'
          script = script.replace("test = dedent(r'''\\\n", "test = dedent(r'''\n")
          exec(compile(script, 'download-queue-tabs-patch.py', 'exec'))

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig').replace('\r\n', '\n')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Give both tab controls and the history list stable names for accessibility/UI regressions.
          xaml_path = 'MainWindow.xaml'
          xaml = read(xaml_path)
          xaml = xaml.replace(
              '<RadioButton Grid.Column="0" GroupName="DownloadQueueTabs"',
              '<RadioButton x:Name="DownloadQueueActiveTab" Grid.Column="0" GroupName="DownloadQueueTabs"',
              1)
          xaml = xaml.replace(
              '<RadioButton Grid.Column="1" GroupName="DownloadQueueTabs"',
              '<RadioButton x:Name="DownloadQueueCompletedTab" Grid.Column="1" GroupName="DownloadQueueTabs"',
              1)
          xaml = xaml.replace(
              '<ItemsControl ItemsSource="{Binding InstallationProgress.CompletedQueueItems}"',
              '<ItemsControl x:Name="CompletedDownloadQueueItemsControl" ItemsSource="{Binding InstallationProgress.CompletedQueueItems}"',
              1)
          write(xaml_path, xaml)

          # Update the existing render regression to validate the two separate views instead of the old mixed list.
          ui_path = 'MCPanel.Tests/ReliabilityTests.Ui.cs'
          ui = read(ui_path)
          first_start = ui.index('    [TestMethod]\n    public void DownloadQueuePopupTemplateRendersReadOnlyQueueRows()')
          first_end = ui.index('    [TestMethod]\n    public void DownloadQueuePopupDeleteActionReachesMainWindowQueueService()', first_start)
          first_method = indent(dedent('''\
          [TestMethod]
          public void DownloadQueuePopupTemplateRendersReadOnlyQueueRows()
          {
              Exception? failure = null;
              var completed = new ManualResetEventSlim();
              var thread = new Thread(() =>
              {
                  MainWindow? window = null;
                  Popup? popup = null;
                  try
                  {
                      window = new MainWindow();
                      var model = (MainViewModel)window.DataContext;
                      var initialActiveCount = model.InstallationProgress.ActiveQueueCount;
                      var initialCompletedCount = model.InstallationProgress.CompletedQueueCount;
                      var activeItems = new List<ProductInstallQueueItemViewModel>();
                      var completedItems = new List<ProductInstallQueueItemViewModel>();

                      for (var index = 1; index <= 2; index++)
                      {
                          var item = new ProductInstallQueueItemViewModel(
                              $"popup-active-test-{index}",
                              100000 + index,
                              new ProductInstallWorkerRequest(
                                  $"ACTIVE{index}",
                                  $"下载中测试软件 {index}",
                                  "在线",
                                  "/Assets/Logo/DS0102.png",
                                  ProductSource.Local,
                                  null,
                                  "Tomcat7",
                                  "MySQL5.6",
                                  "Java",
                                  null,
                                  null,
                                  false,
                                  null,
                                  null,
                                  false),
                              ProductInstallQueueStatus.Pending,
                              0d,
                              "等待处理");
                          activeItems.Add(item);
                          model.InstallationProgress.QueueItems.Add(item);
                      }

                      for (var index = 1; index <= 2; index++)
                      {
                          var item = new ProductInstallQueueItemViewModel(
                              $"popup-completed-test-{index}",
                              200000 + index,
                              new ProductInstallWorkerRequest(
                                  $"DONE{index}",
                                  $"已完成测试软件 {index}",
                                  "在线",
                                  "/Assets/Logo/DS0102.png",
                                  ProductSource.Local,
                                  null,
                                  "Tomcat7",
                                  "MySQL5.6",
                                  "Java",
                                  null,
                                  null,
                                  false,
                                  null,
                                  null,
                                  false),
                              ProductInstallQueueStatus.Completed,
                              100d,
                              "产品文件与运行服务已处理完成。");
                          completedItems.Add(item);
                          model.InstallationProgress.QueueItems.Add(item);
                      }

                      window.Show();
                      window.UpdateLayout();
                      ((FrameworkElement)window.FindName("HomePage")).Visibility = Visibility.Collapsed;
                      ((FrameworkElement)window.FindName("ProductsPage")).Visibility = Visibility.Visible;
                      window.UpdateLayout();

                      var button = (Button)window.FindName("DownloadQueueButton");
                      popup = (Popup)window.FindName("DownloadQueuePopup");
                      button.RaiseEvent(new RoutedEventArgs(Button.ClickEvent));
                      window.Dispatcher.Invoke(() => { }, DispatcherPriority.ApplicationIdle);

                      Assert.IsTrue(popup.IsOpen, "下载队列按钮必须打开弹窗。");
                      var host = (FrameworkElement)window.FindName("DownloadQueuePopupHost");
                      host.Measure(new Size(460d, 560d));
                      host.Arrange(new Rect(host.DesiredSize));
                      host.UpdateLayout();

                      var activeTab = (RadioButton)window.FindName("DownloadQueueActiveTab");
                      var completedTab = (RadioButton)window.FindName("DownloadQueueCompletedTab");
                      Assert.AreEqual(true, activeTab.IsChecked, "弹窗每次打开必须默认停留在“下载中”。");

                      var activeControl = (ItemsControl)window.FindName("DownloadQueueItemsControl");
                      activeControl.UpdateLayout();
                      Assert.AreEqual(initialActiveCount + activeItems.Count, activeControl.Items.Count,
                          "下载中页面只能呈现等待/运行中的任务。");
                      foreach (var item in activeItems)
                      {
                          var container = activeControl.ItemContainerGenerator.ContainerFromItem(item);
                          Assert.IsNotNull(container, "下载中任务必须生成可视行。");
                          Assert.AreEqual(1, FindVisualChildren<ProgressBar>(container!).Count(),
                              "下载中任务应保留实时进度条。");
                          var removeButton = FindVisualChildren<Button>(container!)
                              .Single(candidate => candidate.Visibility == Visibility.Visible);
                          Assert.AreEqual("取消并删除此任务", AutomationProperties.GetName(removeButton));
                      }

                      completedTab.IsChecked = true;
                      window.Dispatcher.Invoke(() => { }, DispatcherPriority.ApplicationIdle);
                      host.UpdateLayout();
                      Assert.AreEqual(false, activeTab.IsChecked);
                      Assert.AreEqual(true, completedTab.IsChecked);

                      var completedControl = (ItemsControl)window.FindName("CompletedDownloadQueueItemsControl");
                      completedControl.UpdateLayout();
                      Assert.AreEqual(initialCompletedCount + completedItems.Count, completedControl.Items.Count,
                          "已完成页面必须呈现所有终态历史记录。");
                      foreach (var item in completedItems)
                      {
                          var container = completedControl.ItemContainerGenerator.ContainerFromItem(item);
                          Assert.IsNotNull(container, "已完成任务必须生成历史记录行。");
                          Assert.AreEqual(0, FindVisualChildren<ProgressBar>(container!).Count(),
                              "已完成历史应使用紧凑记录样式，不再显示无意义的进度条。");
                          var removeButton = FindVisualChildren<Button>(container!).Single();
                          Assert.AreEqual("删除此记录", AutomationProperties.GetName(removeButton));
                          Assert.AreEqual(32d, removeButton.ActualWidth, 0.1d);
                          Assert.AreEqual(32d, removeButton.ActualHeight, 0.1d);
                      }

                      button.RaiseEvent(new RoutedEventArgs(Button.ClickEvent));
                      Assert.IsFalse(popup.IsOpen, "再次点击下载队列按钮必须关闭弹窗。");
                  }
                  catch (Exception ex)
                  {
                      failure = ex;
                  }
                  finally
                  {
                      if (popup is not null)
                      {
                          popup.IsOpen = false;
                      }
                      window?.Close();
                      completed.Set();
                  }
              });
              thread.SetApartmentState(ApartmentState.STA);
              thread.Start();

              Assert.IsTrue(completed.Wait(TimeSpan.FromSeconds(20)), "弹窗渲染测试超时。");
              if (failure is not null)
              {
                  Assert.Fail($"下载队列弹窗无法渲染：{failure}");
              }
          }

          '''), '    ')
          ui = ui[:first_start] + first_method + ui[first_end:]

          second_start = ui.index('    [TestMethod]\n    public void DownloadQueuePopupDeleteActionReachesMainWindowQueueService()')
          second_end = ui.index('    [TestMethod]\n    public void MainWindowCardTemplatesLoadFromSharedResourceDictionary()', second_start)
          second_method = indent(dedent('''\
          [TestMethod]
          public void DownloadQueuePopupDeleteActionReachesMainWindowQueueService()
          {
              Exception? failure = null;
              var completed = new ManualResetEventSlim();
              var thread = new Thread(() =>
              {
                  MainWindow? window = null;
                  Popup? popup = null;
                  try
                  {
                      window = new MainWindow();
                      var model = (MainViewModel)window.DataContext;
                      var item = new ProductInstallQueueItemViewModel(
                          "popup-delete-route-test",
                          300000,
                          new ProductInstallWorkerRequest(
                              "POPUP-DELETE",
                              "弹窗删除路由测试软件",
                              "在线",
                              string.Empty,
                              ProductSource.Online,
                              null,
                              null,
                              null,
                              null,
                              null,
                              null,
                              false,
                              null,
                              null,
                              false),
                          ProductInstallQueueStatus.Completed,
                          100d,
                          "已完成");
                      model.InstallationProgress.QueueItems.Add(item);

                      window.Show();
                      window.UpdateLayout();
                      ((FrameworkElement)window.FindName("HomePage")).Visibility = Visibility.Collapsed;
                      ((FrameworkElement)window.FindName("ProductsPage")).Visibility = Visibility.Visible;
                      window.UpdateLayout();

                      var button = (Button)window.FindName("DownloadQueueButton");
                      popup = (Popup)window.FindName("DownloadQueuePopup");
                      button.RaiseEvent(new RoutedEventArgs(Button.ClickEvent));
                      window.Dispatcher.Invoke(() => { }, DispatcherPriority.ApplicationIdle);

                      var completedTab = (RadioButton)window.FindName("DownloadQueueCompletedTab");
                      completedTab.IsChecked = true;
                      window.Dispatcher.Invoke(() => { }, DispatcherPriority.ApplicationIdle);

                      var itemsControl = (ItemsControl)window.FindName("CompletedDownloadQueueItemsControl");
                      itemsControl.UpdateLayout();
                      var container = itemsControl.ItemContainerGenerator.ContainerFromItem(item);
                      Assert.IsNotNull(container, "已完成页面必须生成删除路由测试项。");
                      var removeButton = FindVisualChildren<Button>(container!).Single();
                      Assert.AreEqual("删除此记录", AutomationProperties.GetName(removeButton));

                      removeButton.RaiseEvent(new RoutedEventArgs(Button.ClickEvent));
                      window.Dispatcher.Invoke(() => { }, DispatcherPriority.ApplicationIdle);

                      Assert.IsFalse(
                          model.InstallationProgress.QueueItems.Contains(item),
                          "已完成页面的删除按钮必须通过主窗体队列服务删除历史记录。");
                  }
                  catch (Exception ex)
                  {
                      failure = ex;
                  }
                  finally
                  {
                      if (popup is not null)
                      {
                          popup.IsOpen = false;
                      }
                      window?.Close();
                      completed.Set();
                  }
              });
              thread.SetApartmentState(ApartmentState.STA);
              thread.Start();

              Assert.IsTrue(completed.Wait(TimeSpan.FromSeconds(20)), "弹窗删除路由测试超时。");
              if (failure is not null)
              {
                  Assert.Fail($"弹窗删除按钮未能到达队列服务：{failure}");
              }
          }

          '''), '    ')
          ui = ui[:second_start] + second_method + ui[second_end:]
          write(ui_path, ui)

          # The empty-state copy intentionally changed with the active/completed split.
          fix_path = 'MCPanel.Tests/ReliabilityTests.DownloadQueueUiFix.cs'
          fix = read(fix_path)
          old = '            Assert.AreEqual("安装队列已完成", progress.QueueSummaryText);\n'
          new = dedent('''\
                      Assert.AreEqual("当前没有下载或安装任务", progress.QueueSummaryText);
                      Assert.IsTrue(progress.ShowActiveQueue);
                      Assert.IsFalse(progress.ShowCompletedQueue);
                      Assert.AreEqual(0, progress.CompletedQueueCount);
                      Assert.AreEqual(Visibility.Visible, progress.ActiveQueueEmptyVisibility);
                      Assert.AreEqual(Visibility.Collapsed, progress.ActiveQueueItemsVisibility);
          ''')
          if old not in fix:
              raise RuntimeError('DownloadQueueUiFix empty-state assertion not found')
          fix = fix.replace(old, new, 1)
          write(fix_path, fix)
          '@ | python -

      - name: Validate diff
        shell: pwsh
        run: git diff --check

      - name: Test download queue regressions
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --filter "FullyQualifiedName~DownloadQueue"

      - name: Test remaining suite
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName!~ComponentStorageMigrationMovesLegacyDirectoriesWithoutOverwritingCache"

      - name: Commit feature
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.Products.cs ViewModels/ProductViewModels.cs Resources/MainWindowTemplates.xaml MCPanel.Tests/ReliabilityTests.DownloadQueueTabs.cs MCPanel.Tests/ReliabilityTests.Ui.cs MCPanel.Tests/ReliabilityTests.DownloadQueueUiFix.cs
          git commit -m "feat: split download queue into active and completed tabs"
          git push origin main
