name: One-time product progress semantics

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-product-progress-semantics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply progress semantics patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig').replace('\r\n', '\n')

          def write(path, text):
              with open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          def replace_exact(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f'{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              text = text.replace(old, new)
              write(path, text)

          # ProductDownloadProgress: distinguish a real known total from protocol telemetry.
          replace_exact('ProductDownloadProgress.cs',
          '''    int ScannedFiles = 0,
              long ScannedBytes = 0)''',
          '''    int ScannedFiles = 0,
              long ScannedBytes = 0,
              bool HasReliableTotal = false)''')
          replace_exact('ProductDownloadProgress.cs',
          '''            var received = ProductTransferFormatting.FormatBytes(BytesReceived);
              if (ScannedFiles > 0 || ScannedBytes > 0)''',
          '''            var received = ProductTransferFormatting.FormatBytes(BytesReceived);
              var hasReliableTotal = HasReliableTotal && TotalBytes is > 0;
              if (ScannedFiles > 0 || ScannedBytes > 0)''')
          replace_exact('ProductDownloadProgress.cs', 'var downloaded = TotalBytes is > 0', 'var downloaded = hasReliableTotal')
          replace_exact('ProductDownloadProgress.cs', 'return TotalBytes is > 0', 'return hasReliableTotal')

          # Mark only HTTP/WebDAV totals that are actually authoritative.
          replace_exact('McPanelStoreClient.cs',
          '''                        snapshot.TotalBytes,
                          ProductTransferFormatting.FormatRate(snapshot.BytesPerSecond)));''',
          '''                        snapshot.TotalBytes,
                          ProductTransferFormatting.FormatRate(snapshot.BytesPerSecond),
                          HasReliableTotal: snapshot.TotalBytes is > 0));''')
          replace_exact('McPanelStoreClient.cs',
          '''            new FileInfo(target).Length,
              ProductTransferFormatting.FormatRate(downloadResult?.AverageBytesPerSecond ?? 0)));''',
          '''            new FileInfo(target).Length,
              ProductTransferFormatting.FormatRate(downloadResult?.AverageBytesPerSecond ?? 0),
              HasReliableTotal: true));''')
          replace_exact('McPanelStoreClient.cs',
          '''                allLengthsKnown ? knownTotalBytes : null,
                  null));''',
          '''                allLengthsKnown ? knownTotalBytes : null,
                  null,
                  HasReliableTotal: allLengthsKnown));''')
          replace_exact('McPanelStoreClient.cs',
          '''                        allLengthsKnown ? knownTotalBytes : null,
                          ProductTransferFormatting.FormatRate(speed)));''',
          '''                        allLengthsKnown ? knownTotalBytes : null,
                          ProductTransferFormatting.FormatRate(speed),
                          HasReliableTotal: allLengthsKnown));''')
          replace_exact('McPanelStoreClient.cs',
          '''                allLengthsKnown ? knownTotalBytes : finalBytes,
                  ProductTransferFormatting.FormatRate(finalBytes / Math.Max((DateTime.UtcNow - downloadStartedAt).TotalSeconds, 0.001))));''',
          '''                allLengthsKnown ? knownTotalBytes : finalBytes,
                  ProductTransferFormatting.FormatRate(finalBytes / Math.Max((DateTime.UtcNow - downloadStartedAt).TotalSeconds, 0.001)),
                  HasReliableTotal: true));''')

          # Carry reliability through the elevated worker. Unknown-size SVN stays indeterminate.
          replace_exact('ProductInstallWorker.cs',
          '''        private long _scannedBytes;
              private double _downloadPercent;''',
          '''        private long _scannedBytes;
              private double _downloadPercent;
              private bool _hasReliableTotal;''')
          replace_exact('ProductInstallWorker.cs',
          '''            _downloadPercent = Compat.Clamp(update.Percent, 0, 100);
              _stage = InstallProgressStage.Downloading;
              _stagePercent = _downloadPercent;
              _speedText = update.SpeedText;
              _bytesReceived = update.BytesReceived;
              _totalBytes = update.TotalBytes;
              _scannedFiles = update.ScannedFiles;
              _scannedBytes = update.ScannedBytes;''',
          '''            _downloadPercent = Compat.Clamp(update.Percent, 0, 100);
              _stage = InstallProgressStage.Downloading;
              _stagePercent = update.HasReliableTotal ? _downloadPercent : null;
              _speedText = update.SpeedText;
              _bytesReceived = update.BytesReceived;
              _totalBytes = update.HasReliableTotal ? update.TotalBytes : null;
              _scannedFiles = update.ScannedFiles;
              _scannedBytes = update.ScannedBytes;
              _hasReliableTotal = update.HasReliableTotal;''')
          replace_exact('ProductInstallWorker.cs',
          '''                totalBytes: update.TotalBytes,
                  scannedFiles: update.ScannedFiles,
                  scannedBytes: update.ScannedBytes);''',
          '''                totalBytes: update.HasReliableTotal ? update.TotalBytes : null,
                  scannedFiles: update.ScannedFiles,
                  scannedBytes: update.ScannedBytes,
                  hasReliableTotal: update.HasReliableTotal);''')
          replace_exact('ProductInstallWorker.cs',
          '''            int scannedFiles = 0,
              long scannedBytes = 0)''',
          '''            int scannedFiles = 0,
              long scannedBytes = 0,
              bool? hasReliableTotal = null)''')
          replace_exact('ProductInstallWorker.cs',
          '''                if (scannedFiles > 0 || scannedBytes > 0)
                  {
                      _scannedFiles = scannedFiles;
                      _scannedBytes = scannedBytes;
                  }

                  try''',
          '''                if (scannedFiles > 0 || scannedBytes > 0)
                  {
                      _scannedFiles = scannedFiles;
                      _scannedBytes = scannedBytes;
                  }
                  _hasReliableTotal = hasReliableTotal ?? _hasReliableTotal;

                  try''')
          replace_exact('ProductInstallWorker.cs',
          '''                                _scannedFiles,
                                  _scannedBytes),''',
          '''                                _scannedFiles,
                                  _scannedBytes,
                                  _hasReliableTotal),''')
          replace_exact('ProductInstallWorker.cs',
          '''    int ScannedFiles = 0,
              long ScannedBytes = 0);''',
          '''    int ScannedFiles = 0,
              long ScannedBytes = 0,
              bool HasReliableTotal = false);''')

          # Installation progress overlay: stage semantics, only real totals get percentages.
          replace_exact('ViewModels/ProductViewModels.cs',
          '''    public string StageText { get => _stageText; private set => SetProperty(ref _stageText, value); }''',
          '''    public string StageText
              {
                  get => _stageText;
                  private set
                  {
                      if (SetProperty(ref _stageText, value))
                      {
                          OnPropertyChanged(nameof(ProgressText));
                          OnPropertyChanged(nameof(IsProgressIndeterminate));
                      }
                  }
              }''')
          replace_exact('ViewModels/ProductViewModels.cs',
          '''                OnPropertyChanged(nameof(PauseActionText));''',
          '''                OnPropertyChanged(nameof(PauseActionText));
                  OnPropertyChanged(nameof(ProgressText));
                  OnPropertyChanged(nameof(IsProgressIndeterminate));''', count=1)
          replace_exact('ViewModels/ProductViewModels.cs',
          '''                OnPropertyChanged(nameof(OverallDownloadProgress));''',
          '''                OnPropertyChanged(nameof(OverallDownloadProgress));
                  OnPropertyChanged(nameof(ProgressText));''', count=1)
          replace_exact('ViewModels/ProductViewModels.cs',
          '''    public string ProgressText => $"{Progress:0.0}%";
              public bool IsProgressIndeterminate => IsVisible &&
                  (StageText == "准备下载" || (StageText == "下载产品文件" && !_downloadTotalKnown));''',
          '''    public string ProgressText => StageText == "处理完成"
                  ? "完成"
                  : IsPaused
                      ? "已暂停"
                      : StageText == "下载产品文件" && _downloadTotalKnown
                          ? $"{DownloadProgress:0}%"
                          : "处理中";
              public bool IsProgressIndeterminate => IsVisible &&
                  !IsPaused &&
                  StageText != "处理完成" &&
                  (StageText != "下载产品文件" || !_downloadTotalKnown);''')
          replace_exact('ViewModels/ProductViewModels.cs',
          '''        _downloadTotalKnown = update.TotalBytes is > 0;''',
          '''        _downloadTotalKnown = update.HasReliableTotal && update.TotalBytes is > 0;''')
          replace_exact('ViewModels/ProductViewModels.cs',
          '''                update.ScannedFiles,
                  update.ScannedBytes).TransferText''',
          '''                update.ScannedFiles,
                  update.ScannedBytes,
                  update.HasReliableTotal).TransferText''')

          # Product-card activity indicator: determinate only when the transfer source really knows the total.
          replace_exact('ViewModels/ProductViewModels.cs',
          '''    private double _downloadProgress;
              private int _installSequence''',
          '''    private double _downloadProgress;
              private bool _isDownloadProgressIndeterminate;
              private int _installSequence''')
          replace_exact('ViewModels/ProductViewModels.cs',
          '''    public double DownloadProgress { get => _downloadProgress; set => SetProperty(ref _downloadProgress, value); }''',
          '''    public double DownloadProgress
              {
                  get => _downloadProgress;
                  set
                  {
                      if (SetProperty(ref _downloadProgress, Compat.Clamp(value, 0, 100)))
                      {
                          OnPropertyChanged(nameof(DownloadProgressText));
                      }
                  }
              }
              public bool IsDownloadProgressIndeterminate
              {
                  get => _isDownloadProgressIndeterminate;
                  set
                  {
                      if (SetProperty(ref _isDownloadProgressIndeterminate, value))
                      {
                          OnPropertyChanged(nameof(DownloadProgressText));
                      }
                  }
              }
              public string DownloadProgressText => IsDownloadProgressIndeterminate ? string.Empty : $"{DownloadProgress:0}%";''')

          # Queue rows expose stage + real transfer telemetry instead of a fake overall percent.
          replace_exact('ProductInstallQueue.cs',
          '''    private bool _isPaused;
              private bool _isRemovalRequested;''',
          '''    private bool _isPaused;
              private bool _isRemovalRequested;
              private bool _hasReliableTotal;
              private long _bytesReceived;
              private long? _totalBytes;
              private string? _speedText;
              private int _scannedFiles;''')
          replace_exact('ProductInstallQueue.cs',
          '''            OnPropertyChanged(nameof(RemoveToolTip));''',
          '''            OnPropertyChanged(nameof(RemoveToolTip));
                  OnPropertyChanged(nameof(ProgressText));
                  OnPropertyChanged(nameof(IsProgressIndeterminate));
                  OnPropertyChanged(nameof(TransferText));''', count=1)
          replace_exact('ProductInstallQueue.cs',
          '''    public double DownloadProgress
              {
                  get => _downloadProgress;
                  private set => SetProperty(ref _downloadProgress, Compat.Clamp(value, 0, 100));
              }

              public string ProgressText => $"{Progress:0.0}%";''',
          '''    public double DownloadProgress
              {
                  get => _downloadProgress;
                  private set
                  {
                      if (SetProperty(ref _downloadProgress, Compat.Clamp(value, 0, 100)))
                      {
                          OnPropertyChanged(nameof(ProgressText));
                      }
                  }
              }

              public bool IsProgressIndeterminate => State == ProductInstallQueueStatus.Running &&
                                                     !IsPaused &&
                                                     (_stage != InstallProgressStage.Downloading || !_hasReliableTotal);
              public string ProgressText => State switch
              {
                  ProductInstallQueueStatus.Pending => string.Empty,
                  ProductInstallQueueStatus.Running when IsPaused => "已暂停",
                  ProductInstallQueueStatus.Running when _stage == InstallProgressStage.Downloading && _hasReliableTotal => $"{DownloadProgress:0}%",
                  ProductInstallQueueStatus.Running when _stage == InstallProgressStage.Downloading => "下载中",
                  ProductInstallQueueStatus.Running when _stage == InstallProgressStage.Installing => "部署中",
                  ProductInstallQueueStatus.Running => "准备中",
                  ProductInstallQueueStatus.Completed => "完成",
                  ProductInstallQueueStatus.Failed => "失败",
                  ProductInstallQueueStatus.Cancelled => "已取消",
                  _ => string.Empty
              };
              public string TransferText
              {
                  get
                  {
                      if (!IsDownloading)
                      {
                          return string.Empty;
                      }

                      var parts = new List<string>();
                      if (_bytesReceived > 0)
                      {
                          var downloaded = $"已下载 {ProductTransferFormatting.FormatBytes(_bytesReceived)}";
                          if (_hasReliableTotal && _totalBytes is > 0)
                          {
                              downloaded += $" / {ProductTransferFormatting.FormatBytes(_totalBytes.Value)}";
                          }
                          parts.Add(downloaded);
                      }
                      if (!string.IsNullOrWhiteSpace(_speedText))
                      {
                          parts.Add($"速度 {_speedText}");
                      }
                      if (_scannedFiles > 0)
                      {
                          parts.Add($"已扫描 {_scannedFiles:N0} 项");
                      }
                      return string.Join(" · ", parts);
                  }
              }''')
          replace_exact('ProductInstallQueue.cs',
          '''            OnPropertyChanged(nameof(CanTogglePause));
              }''',
          '''            OnPropertyChanged(nameof(CanTogglePause));
                  OnPropertyChanged(nameof(ProgressText));
                  OnPropertyChanged(nameof(IsProgressIndeterminate));
              }''', count=1)
          replace_exact('ProductInstallQueue.cs',
          '''                ProductInstallQueueStatus.Running => IsUpdate ? "正在更新" : "正在安装",''',
          '''                ProductInstallQueueStatus.Running => _stage switch
                  {
                      InstallProgressStage.Preparing => "准备中",
                      InstallProgressStage.Downloading => IsUpdate ? "正在下载更新" : "正在下载",
                      InstallProgressStage.Installing => IsUpdate ? "正在部署更新" : "正在部署",
                      _ => IsUpdate ? "正在更新" : "正在安装"
                  },''')
          replace_exact('ProductInstallQueue.cs',
          '''        _stage = update.Stage;
              DownloadProgress = update.Stage switch''',
          '''        _stage = update.Stage;
              _hasReliableTotal = update.HasReliableTotal && update.TotalBytes is > 0;
              _bytesReceived = update.BytesReceived;
              _totalBytes = update.TotalBytes;
              _speedText = update.SpeedText;
              _scannedFiles = update.ScannedFiles;
              DownloadProgress = update.Stage switch''')
          replace_exact('ProductInstallQueue.cs',
          '''        OnPropertyChanged(nameof(IsDownloading));
              OnPropertyChanged(nameof(CanTogglePause));''',
          '''        OnPropertyChanged(nameof(IsDownloading));
              OnPropertyChanged(nameof(CanTogglePause));
              OnPropertyChanged(nameof(StateText));
              OnPropertyChanged(nameof(ProgressText));
              OnPropertyChanged(nameof(IsProgressIndeterminate));
              OnPropertyChanged(nameof(TransferText));''', count=1)

          # Mirror stage semantics onto product cards.
          replace_exact('MainWindow.Products.cs',
          '''            product.DownloadProgress = 0;
              product.StatusText = preflight.BuildMessage();''',
          '''            product.DownloadProgress = 0;
              product.IsDownloadProgressIndeterminate = false;
              product.StatusText = preflight.BuildMessage();''')
          replace_exact('MainWindow.Products.cs',
          '''            product.SetQueueState(item.State, item.QueuePosition);
              product.IsBusy = false;
              product.StatusText = $"已加入安装队列，等待第 {item.QueuePosition} 项处理。";''',
          '''            product.SetQueueState(item.State, item.QueuePosition);
              product.IsBusy = false;
              product.IsDownloadProgressIndeterminate = false;
              product.StatusText = $"已加入安装队列，等待第 {item.QueuePosition} 项处理。";''')
          replace_exact('MainWindow.Products.cs',
          '''            product.DownloadProgress = 0;
              product.StatusText = $"加入安装队列失败：''',
          '''            product.DownloadProgress = 0;
              product.IsDownloadProgressIndeterminate = false;
              product.StatusText = $"加入安装队列失败：''')
          replace_exact('MainWindow.Products.cs',
          '''            product.SetQueueState(null, 0);
              product.IsBusy = false;
              return;''',
          '''            product.SetQueueState(null, 0);
              product.IsBusy = false;
              product.IsDownloadProgressIndeterminate = false;
              return;''', count=1)
          replace_exact('MainWindow.Products.cs',
          '''        product.SetQueueState(item.State, item.QueuePosition);
              product.IsBusy = item.State == ProductInstallQueueStatus.Running;''',
          '''        product.SetQueueState(item.State, item.QueuePosition);
              product.IsBusy = item.State == ProductInstallQueueStatus.Running;
              product.IsDownloadProgressIndeterminate = item.IsProgressIndeterminate;''')
          replace_exact('MainWindow.Products.cs',
          '''        product.IsBusy = true;
              product.DownloadProgress = progress.Percent;
              product.StatusText = progress.Message;''',
          '''        product.IsBusy = true;
              product.DownloadProgress = progress.Stage == InstallProgressStage.Downloading
                  ? progress.StagePercent ?? progress.Percent
                  : 0;
              product.IsDownloadProgressIndeterminate = progress.Stage != InstallProgressStage.Completed &&
                                                        (progress.Stage != InstallProgressStage.Downloading || !progress.HasReliableTotal);
              product.StatusText = progress.Message;''')
          replace_exact('MainWindow.Products.cs',
          '''            product.SetQueueState(null, 0);
              product.IsBusy = false;
              if (item.State == ProductInstallQueueStatus.Completed)''',
          '''            product.SetQueueState(null, 0);
              product.IsBusy = false;
              product.IsDownloadProgressIndeterminate = false;
              if (item.State == ProductInstallQueueStatus.Completed)''')

          # CircularProgress gains a real indeterminate spinner mode.
          replace_exact('Controls/PanelProgressControls.cs',
          '''    public static readonly DependencyProperty AnimatedValueProperty =
              DependencyProperty.Register(
                  nameof(AnimatedValue),
                  typeof(double),
                  typeof(CircularProgress),
                  new FrameworkPropertyMetadata(0d, FrameworkPropertyMetadataOptions.AffectsRender));''',
          '''    public static readonly DependencyProperty AnimatedValueProperty =
              DependencyProperty.Register(
                  nameof(AnimatedValue),
                  typeof(double),
                  typeof(CircularProgress),
                  new FrameworkPropertyMetadata(0d, FrameworkPropertyMetadataOptions.AffectsRender));

              public static readonly DependencyProperty IsIndeterminateProperty =
                  DependencyProperty.Register(
                      nameof(IsIndeterminate),
                      typeof(bool),
                      typeof(CircularProgress),
                      new FrameworkPropertyMetadata(false, FrameworkPropertyMetadataOptions.AffectsRender, OnIsIndeterminateChanged));

              private static readonly DependencyProperty IndeterminateAngleProperty =
                  DependencyProperty.Register(
                      nameof(IndeterminateAngle),
                      typeof(double),
                      typeof(CircularProgress),
                      new FrameworkPropertyMetadata(0d, FrameworkPropertyMetadataOptions.AffectsRender));''')
          replace_exact('Controls/PanelProgressControls.cs',
          '''    private static readonly Duration ValueAnimationDuration =
              new(TimeSpan.FromMilliseconds(700));''',
          '''    private static readonly Duration ValueAnimationDuration =
              new(TimeSpan.FromMilliseconds(700));
              private static readonly Duration IndeterminateAnimationDuration =
                  new(TimeSpan.FromMilliseconds(1050));

              public CircularProgress()
              {
                  Loaded += (_, _) =>
                  {
                      if (IsIndeterminate)
                      {
                          StartIndeterminateAnimation();
                      }
                  };
                  Unloaded += (_, _) => StopIndeterminateAnimation();
              }''')
          replace_exact('Controls/PanelProgressControls.cs',
          '''    public double AnimatedValue => (double)GetValue(AnimatedValueProperty);''',
          '''    public double AnimatedValue => (double)GetValue(AnimatedValueProperty);
              public bool IsIndeterminate
              {
                  get => (bool)GetValue(IsIndeterminateProperty);
                  set => SetValue(IsIndeterminateProperty, value);
              }
              private double IndeterminateAngle => (double)GetValue(IndeterminateAngleProperty);''')
          replace_exact('Controls/PanelProgressControls.cs',
          '''        drawingContext.DrawEllipse(null, trackPen, center, radius, radius);

              var percent = Compat.Clamp(AnimatedValue, 0, 100);''',
          '''        drawingContext.DrawEllipse(null, trackPen, center, radius, radius);

              if (IsIndeterminate)
              {
                  var startAngle = IndeterminateAngle - 90d;
                  var endAngle = startAngle + 96d;
                  var start = PointOnCircle(center, radius, startAngle);
                  var end = PointOnCircle(center, radius, endAngle);
                  var geometry = new StreamGeometry();
                  using (var context = geometry.Open())
                  {
                      context.BeginFigure(start, isFilled: false, isClosed: false);
                      context.ArcTo(end, new Size(radius, radius), 0, false, SweepDirection.Clockwise, true, false);
                  }
                  geometry.Freeze();
                  drawingContext.DrawGeometry(null, progressPen, geometry);
                  return;
              }

              var percent = Compat.Clamp(AnimatedValue, 0, 100);''')
          replace_exact('Controls/PanelProgressControls.cs',
          '''    private static void OnValueChanged(DependencyObject dependencyObject, DependencyPropertyChangedEventArgs args)''',
          '''    private static void OnIsIndeterminateChanged(DependencyObject dependencyObject, DependencyPropertyChangedEventArgs args)
              {
                  var control = (CircularProgress)dependencyObject;
                  if ((bool)args.NewValue && control.IsLoaded)
                  {
                      control.StartIndeterminateAnimation();
                  }
                  else
                  {
                      control.StopIndeterminateAnimation();
                  }
              }

              private void StartIndeterminateAnimation()
              {
                  var animation = new DoubleAnimation
                  {
                      From = 0d,
                      To = 360d,
                      Duration = IndeterminateAnimationDuration,
                      RepeatBehavior = RepeatBehavior.Forever,
                      FillBehavior = FillBehavior.HoldEnd
                  };
                  BeginAnimation(IndeterminateAngleProperty, animation, HandoffBehavior.SnapshotAndReplace);
              }

              private void StopIndeterminateAnimation()
              {
                  BeginAnimation(IndeterminateAngleProperty, null);
                  SetValue(IndeterminateAngleProperty, 0d);
              }

              private static void OnValueChanged(DependencyObject dependencyObject, DependencyPropertyChangedEventArgs args)''')

          # UI: top ring is activity-only; queue and modal bars switch between determinate and indeterminate modes.
          replace_exact('MainWindow.xaml',
          '''                                    <local:CircularProgress Value="{Binding InstallationProgress.OverallDownloadProgress}"
                                                              Width="48"''',
          '''                                    <local:CircularProgress Value="0"
                                                              IsIndeterminate="True"
                                                              Width="48"''')
          replace_exact('MainWindow.xaml',
          '''                                                            Visibility="{Binding InstallationProgress.IsDownloading, Converter={StaticResource BooleanToVisibility}}" />''',
          '''                                                            Visibility="{Binding InstallationProgress.HasActiveQueue, Converter={StaticResource BooleanToVisibility}}" />''', count=1)
          replace_exact('MainWindow.xaml',
          '''                                <TextBlock Text="总体进度" Foreground="{DynamicResource MutedBrush}" FontSize="12" />''',
          '''                                <TextBlock Text="当前阶段" Foreground="{DynamicResource MutedBrush}" FontSize="12" />''')
          replace_exact('MainWindow.xaml',
          '''                                     Value="{Binding InstallationProgress.Progress, Mode=OneWay}"''',
          '''                                     Value="{Binding InstallationProgress.DownloadProgress, Mode=OneWay}"''', count=1)
          replace_exact('MainWindow.xaml',
          '''                                   Text="任务按加入时间逐项处理；关闭面板或窗口到托盘不会中断后台下载、安装和部署。"''',
          '''                                   Text="任务按加入时间逐项处理；SVN 下载显示真实容量、速度和阶段状态，不使用不可靠的估算百分比。关闭面板或窗口到托盘不会中断后台任务。"''')

          replace_exact('Resources/MainWindowTemplates.xaml',
          '''                        <local:CircularProgress Value="{Binding DownloadProgress, Mode=OneWay}"
                                                   ProgressBrush="{DynamicResource PrimaryBrush}"''',
          '''                        <local:CircularProgress Value="{Binding DownloadProgress, Mode=OneWay}"
                                                   IsIndeterminate="{Binding IsDownloadProgressIndeterminate}"
                                                   ProgressBrush="{DynamicResource PrimaryBrush}"''')
          replace_exact('Resources/MainWindowTemplates.xaml',
          '''                        <TextBlock Text="{Binding DownloadProgress, StringFormat={}{0:N0}%}"''',
          '''                        <TextBlock Text="{Binding DownloadProgressText}"''')
          replace_exact('Resources/MainWindowTemplates.xaml',
          '''                    <RowDefinition Height="Auto" />
                      <RowDefinition Height="Auto" />
                      <RowDefinition Height="Auto" />
                  </Grid.RowDefinitions>
                  <Grid.ColumnDefinitions>
                      <ColumnDefinition Width="52" />''',
          '''                    <RowDefinition Height="Auto" />
                      <RowDefinition Height="Auto" />
                      <RowDefinition Height="Auto" />
                      <RowDefinition Height="Auto" />
                  </Grid.RowDefinitions>
                  <Grid.ColumnDefinitions>
                      <ColumnDefinition Width="52" />''', count=1)
          replace_exact('Resources/MainWindowTemplates.xaml',
          '''                <ProgressBar Grid.Row="1"
                               Grid.ColumnSpan="5"
                               Style="{DynamicResource MetricProgress}"
                               Value="{Binding Progress, Mode=OneWay}"
                               Maximum="100"
                               Margin="62,8,0,0" />''',
          '''                <ProgressBar Grid.Row="1"
                               Grid.ColumnSpan="5"
                               Style="{DynamicResource MetricProgress}"
                               Value="{Binding DownloadProgress, Mode=OneWay}"
                               Maximum="100"
                               IsIndeterminate="{Binding IsProgressIndeterminate}"
                               Margin="62,8,0,0" />''')
          replace_exact('Resources/MainWindowTemplates.xaml',
          '''                <TextBlock Grid.Row="2"
                             Grid.ColumnSpan="5"
                             Text="{Binding Message}"
                             ToolTip="{Binding Message}"
                             Foreground="{DynamicResource MutedBrush}"
                             FontSize="10"
                             Margin="62,6,0,0"
                             TextTrimming="CharacterEllipsis" />''',
          '''                <TextBlock Grid.Row="2"
                             Grid.ColumnSpan="5"
                             Text="{Binding Message}"
                             ToolTip="{Binding Message}"
                             Foreground="{DynamicResource MutedBrush}"
                             FontSize="10"
                             Margin="62,6,0,0"
                             TextTrimming="CharacterEllipsis" />
                  <TextBlock Grid.Row="3"
                             Grid.ColumnSpan="5"
                             Text="{Binding TransferText}"
                             ToolTip="{Binding TransferText}"
                             Foreground="{DynamicResource PrimaryBrush}"
                             FontSize="10"
                             Margin="62,4,0,0"
                             TextTrimming="CharacterEllipsis" />''')

          # Add focused regression coverage.
          test = r'''using Microsoft.VisualStudio.TestTools.UnitTesting;
          using System.Windows;

          namespace MCPanel.Tests;

          public sealed partial class ReliabilityTests
          {
              [TestMethod]
              public void ProductTransferOnlyShowsTotalWhenItIsReliable()
              {
                  var uncertain = new ProductDownloadProgress(
                      42,
                      "SVN",
                      6L * 1024 * 1024 * 1024,
                      7L * 1024 * 1024 * 1024,
                      "20.0 MB/s",
                      HasReliableTotal: false);
                  StringAssert.Contains(uncertain.TransferText, "已下载 6 GB");
                  Assert.IsFalse(uncertain.TransferText.Contains(" / "), "SVN telemetry must not masquerade as an authoritative total.");

                  var reliable = uncertain with { HasReliableTotal = true };
                  StringAssert.Contains(reliable.TransferText, "已下载 6 GB / 7 GB");
              }

              [TestMethod]
              public void QueueUsesIndeterminateStageForUnknownSizeDownload()
              {
                  var root = CreateTemporaryDirectory();
                  try
                  {
                      using var queue = new ProductInstallQueueService(
                          new InstallationProgressViewModel(),
                          root,
                          autoStartWorker: false);
                      var item = queue.Enqueue(
                          new ProductItem("PROGRESS-SVN", "SVN 产品", "测试", string.Empty, ProductSource.Online),
                          isUpdate: false);
                      item.SetState(ProductInstallQueueStatus.Running);
                      item.ApplyProgress(new ProductInstallWorkerProgress(
                          "running",
                          0,
                          "正在扫描并下载",
                          InstallProgressStage.Downloading,
                          42,
                          "18.5 MB/s",
                          6L * 1024 * 1024 * 1024,
                          7L * 1024 * 1024 * 1024,
                          ScannedFiles: 12846,
                          HasReliableTotal: false));

                      Assert.IsTrue(item.IsProgressIndeterminate);
                      Assert.AreEqual("下载中", item.ProgressText);
                      StringAssert.Contains(item.TransferText, "已下载 6 GB");
                      StringAssert.Contains(item.TransferText, "速度 18.5 MB/s");
                      StringAssert.Contains(item.TransferText, "已扫描 12,846 项");
                      Assert.IsFalse(item.TransferText.Contains(" / "));

                      item.ApplyProgress(new ProductInstallWorkerProgress(
                          "running",
                          30,
                          "HTTP 下载",
                          InstallProgressStage.Downloading,
                          30,
                          "25.0 MB/s",
                          3L * 1024 * 1024 * 1024,
                          10L * 1024 * 1024 * 1024,
                          HasReliableTotal: true));
                      Assert.IsFalse(item.IsProgressIndeterminate);
                      Assert.AreEqual("30%", item.ProgressText);
                      StringAssert.Contains(item.TransferText, "3 GB / 10 GB");
                  }
                  finally
                  {
                      DeleteTemporaryTree(root);
                  }
              }

              [TestMethod]
              public void CircularProgressSupportsIndeterminateActivityMode()
              {
                  var progress = new CircularProgress { IsIndeterminate = true };
                  Assert.IsTrue(progress.IsIndeterminate);
              }
          }
