name: One-time update concurrency and elevation v4

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply-update-concurrency-elevation-v4.flag'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply final patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/one-time-update-concurrency-elevation.yml').read_text(encoding='utf-8')
          match = re.search(r"          @'\n(.*?)\n          '@ \| python", workflow, re.S)
          if match is None:
              raise SystemExit('Could not extract original patch program.')
          exec(compile(textwrap.dedent(match.group(1)), '<update-concurrency-patch>', 'exec'), {})

          path = Path('ApplicationUpdateService.cs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    public void LaunchUpdater\(\s*PreparedApplicationUpdate update,\s*ApplicationUpdateAuthorization\? authorization = null\)\s*\{',
              re.S)
          replacement = '''    public void LaunchUpdater(PreparedApplicationUpdate update) =>
              LaunchUpdater(update, authorization: null);

          internal void LaunchUpdater(
              PreparedApplicationUpdate update,
              ApplicationUpdateAuthorization? authorization)
          {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Corrected LaunchUpdater target count: {count}')
          text = text.replace(
              '''        var validatedCancelFile = Path.GetFullPath(cancelFile);
          if (!PathsEqual(Path.GetDirectoryName(validatedCancelFile) ?? string.Empty, helperRoot) ||
              !string.Equals(Path.GetFileName(validatedCancelFile), "cancel.flag", StringComparison.OrdinalIgnoreCase))''',
              '''        var validatedCancelFile = Path.GetFullPath(cancelFile);
          var cancelDirectory = Path.GetDirectoryName(validatedCancelFile);
          if (string.IsNullOrWhiteSpace(cancelDirectory) ||
              !PathsEqual(cancelDirectory!, helperRoot) ||
              !string.Equals(Path.GetFileName(validatedCancelFile), "cancel.flag", StringComparison.OrdinalIgnoreCase))''',
              1)
          path.write_text(text, encoding='utf-8')

          test = Path('MCPanel.Tests/ReliabilityTests.ApplicationUpdateConcurrency119.cs')
          test.write_text('''using System;\nusing Microsoft.VisualStudio.TestTools.UnitTesting;\n\nnamespace MCPanel.Tests;\n\npublic sealed partial class ReliabilityTests\n{\n    [TestMethod]\n    public void ApplicationUpdatePreauthorizesElevationAfterExistingConfirmation()\n    {\n        Assert.IsTrue(ApplicationUpdateService.ShouldRequestPreauthorizedUpdater(isAdministrator: false));\n        Assert.IsFalse(ApplicationUpdateService.ShouldRequestPreauthorizedUpdater(isAdministrator: true));\n\n        var settings = ReadRepositoryFile("MainWindow.Settings.cs").Replace("\\r\\n", "\\n");\n        StringAssert.Contains(settings, "if (!ConfirmOnlineUpdate(update.Manifest)) return null;\\n                if (!RequestApplicationUpdateAuthorizationAfterConfirmation()) return null;");\n        StringAssert.Contains(settings, "if (!ConfirmOnlineUpdate(manifest)) return null;\\n            if (!RequestApplicationUpdateAuthorizationAfterConfirmation()) return null;");\n\n        var app = ReadRepositoryFile("App.xaml.cs");\n        StringAssert.Contains(app, "--wait-update-plan");\n        var updater = ReadRepositoryFile("ApplicationUpdateService.cs");\n        StringAssert.Contains(updater, "elevated: true");\n        StringAssert.Contains(updater, "WaitForAuthorizedUpdatePlanAsync");\n    }\n\n    [TestMethod]\n    public void ApplicationUpdateCanPrepareWhileProductDownloadsRemainActive()\n    {\n        var settings = ReadRepositoryFile("MainWindow.Settings.cs");\n        var canStartIndex = settings.IndexOf("private bool CanStartApplicationUpdate()", StringComparison.Ordinal);\n        var nextMethodIndex = settings.IndexOf("private bool RequestApplicationUpdateAuthorizationAfterConfirmation()", canStartIndex, StringComparison.Ordinal);\n        Assert.IsTrue(canStartIndex >= 0 && nextMethodIndex > canStartIndex);\n        var canStartBody = settings.Substring(canStartIndex, nextMethodIndex - canStartIndex);\n        Assert.IsFalse(canStartBody.Contains("_productInstallQueue.HasActiveItems", StringComparison.Ordinal));\n        StringAssert.Contains(settings, "WaitForProductInstallQueueBeforeApplyingUpdateAsync");\n        StringAssert.Contains(settings, "当前产品下载/安装继续运行");\n    }\n}\n''', encoding='utf-8')
          '@ | python

      - name: Test update flow
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ApplicationUpdate"

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add ApplicationUpdateService.cs App.xaml.cs MainWindow.xaml.cs MainWindow.Settings.cs MCPanel.Tests/ReliabilityTests.ApplicationUpdateConcurrency119.cs
          git commit -m "fix: allow updates alongside product downloads with preauthorized UAC"
          git push origin HEAD:main
