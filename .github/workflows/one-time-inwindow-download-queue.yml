name: One-time in-window download queue refactor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inwindow-download-queue.yml'
      - '.github/scripts/apply-inwindow-download-queue-v3.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply in-window queue flyout refactor
        shell: pwsh
        run: python .github/scripts/apply-inwindow-download-queue-v3.py

      - name: Validate diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git grep -n "DownloadQueuePopup" -- MainWindow.xaml MainWindow.xaml.cs MainWindow.Products.cs MainWindow.DownloadQueueFix.cs MainWindowTemplates.xaml.cs
          if ($LASTEXITCODE -eq 0) { throw 'Native queue popup references remain.' }
          exit 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Run regression suite
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }

      - name: Commit refactor
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.xaml.cs MainWindow.Products.cs MainWindow.DownloadQueueFix.cs MainWindowTemplates.xaml.cs MCPanel.Tests/ReliabilityTests.DownloadQueueUiFix.cs
          git commit -m "ui: keep download queue flyout inside main window"
          git push origin main
