name: One-time Catalina final audit 1.3.39

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.head_commit.message == 'Add one-time Catalina final audit 1.3.39'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Apply final Catalina audit cleanup
        shell: pwsh
        run: |
          $path = 'TomcatProductInstanceManager.cs'
          $text = Get-Content -LiteralPath $path -Raw
          $old = $text
          $text = $text.Replace('Catalina 诊断窗口', 'Catalina 窗口')
          if ($text -eq $old) {
            throw 'Expected product-level Catalina diagnostic wording was not found.'
          }
          Set-Content -LiteralPath $path -Value $text -Encoding utf8

          $testPath = 'MCPanel.Tests/ReliabilityTests.CatalinaProductNoReadiness139.cs'
          @'
          using System;
          using Microsoft.VisualStudio.TestTools.UnitTesting;

          namespace MCPanel.Tests;

          public sealed partial class ReliabilityTests
          {
              [TestMethod]
              public void ProductCatalinaLaunchDoesNotRunAutomaticReadinessDiagnostics()
              {
                  var instances = ReadRepositoryFile("TomcatProductInstanceManager.cs");
                  var start = instances.IndexOf("if (catalinaMode)", StringComparison.Ordinal);
                  var end = instances.IndexOf("await StartTomcatAsync", start, StringComparison.Ordinal);
                  Assert.IsTrue(start >= 0 && end > start);
                  var branch = instances.Substring(start, end - start);

                  StringAssert.Contains(branch, "StartCatalinaConsole");
                  Assert.IsFalse(branch.Contains("WaitForPortAsync", StringComparison.Ordinal));
                  Assert.IsFalse(branch.Contains("WaitForStartupAsync", StringComparison.Ordinal));
                  Assert.IsFalse(branch.Contains("EnsureStableAsync", StringComparison.Ordinal));
                  Assert.IsFalse(branch.Contains("ReadHttpPorts", StringComparison.Ordinal));
                  Assert.IsFalse(instances.Contains("Catalina 诊断窗口", StringComparison.Ordinal));
              }
          }
          '@ | Set-Content -LiteralPath $testPath -Encoding utf8

      - name: Full regression tests and Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelCatalinaFinalAuditPublish'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) {
            throw "Publish validation failed with exit code $LASTEXITCODE"
          }

      - name: Commit validated Catalina audit cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- '.github/workflows/one-time-catalina-final-audit-1.3.39.yml'
          git add -- 'TomcatProductInstanceManager.cs' 'MCPanel.Tests/ReliabilityTests.CatalinaProductNoReadiness139.cs'
          git commit -m 'Validate final Catalina cleanup for 1.3.39'
          git push origin HEAD:main
