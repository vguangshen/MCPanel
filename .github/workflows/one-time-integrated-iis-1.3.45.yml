name: One-time integrated IIS pipeline 1.3.45

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by the vendored SharpSvn build.'
          }

      - name: Apply Integrated IIS pipeline behavior
        shell: pwsh
        run: |
          $path = 'ProductDeploymentService.cs'
          $text = Get-Content -LiteralPath $path -Raw
          $pattern = '(?s)    internal static string ResolveIisPipelineMode\(string\? runEnvironment, string managedRuntimeVersion\)\s*\{.*?\r?\n    \}\r?\n\r?\n    private static int SelectIisPort'
          $replacement = @'
              internal static string ResolveIisPipelineMode(string? runEnvironment, string managedRuntimeVersion)
              {
                  // Match the original ITMCStore application-pool behavior while
                  // retaining MCPanel's current IIS 7+ appcmd management path.
                  // CLR selection (v2.0/v4.0/no managed CLR) remains independent;
                  // every IIS product uses the Integrated request-processing pipeline.
                  _ = runEnvironment;
                  _ = managedRuntimeVersion;
                  return "Integrated";
              }

              private static int SelectIisPort
          '@
          $replacement = $replacement -replace '(?m)^            ', ''
          $updated = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($updated -eq $text) {
            throw 'ResolveIisPipelineMode block was not replaced.'
          }
          if ($updated -match 'return\s+"Classic"') {
            throw 'Classic IIS pipeline mapping is still present.'
          }
          [IO.File]::WriteAllText((Join-Path $PWD $path), $updated, [Text.UTF8Encoding]::new($false))

          $test = @'
          using Microsoft.VisualStudio.TestTools.UnitTesting;

          namespace MCPanel.Tests;

          public partial class ReliabilityTests
          {
              [TestMethod]
              public void Iis145_AllFrameworkFamiliesUseIntegratedPipeline()
              {
                  Assert.AreEqual("Integrated", ProductDeploymentService.ResolveIisPipelineMode("Framework2.0", "v2.0"));
                  Assert.AreEqual("Integrated", ProductDeploymentService.ResolveIisPipelineMode("Framework3.5", "v2.0"));
                  Assert.AreEqual("Integrated", ProductDeploymentService.ResolveIisPipelineMode("Framework4.0", "v4.0"));
                  Assert.AreEqual("Integrated", ProductDeploymentService.ResolveIisPipelineMode("IIS", "v4.0"));
                  Assert.AreEqual("Integrated", ProductDeploymentService.ResolveIisPipelineMode(null, "v4.0"));
                  Assert.AreEqual("Integrated", ProductDeploymentService.ResolveIisPipelineMode("ASP.NET Core", string.Empty));
              }

              [TestMethod]
              public void Iis145_BindScriptExplicitlyWritesIntegratedPipeline()
              {
                  var script = ProductDeploymentService.BuildIisBindScript(
                      @"C:\Windows\System32\inetsrv\appcmd.exe",
                      "MCPanel",
                      @"C:\MCPanel\Runtime\IISRoot",
                      "/YX030101",
                      @"C:\MCPanel\Products\YX030101",
                      "YX030101",
                      "v2.0",
                      "Integrated",
                      enable32Bit: true,
                      port: 8088);

                  StringAssert.Contains(script, "$managedPipelineMode='Integrated'");
                  StringAssert.Contains(script, "/managedPipelineMode:$managedPipelineMode");
              }
          }
          '@
          $test = $test -replace '(?m)^          ', ''
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'MCPanel.Tests\ReliabilityTests.IisIntegratedPipeline145.cs'),
            $test,
            [Text.UTF8Encoding]::new($false))

          $projectPath = 'MCPanel.csproj'
          $project = Get-Content -LiteralPath $projectPath -Raw
          $project = $project.Replace('<Version>1.3.44</Version>', '<Version>1.3.45</Version>')
          $project = $project.Replace('<FileVersion>1.3.44.0</FileVersion>', '<FileVersion>1.3.45.0</FileVersion>')
          $project = $project.Replace('<AssemblyVersion>1.3.44.0</AssemblyVersion>', '<AssemblyVersion>1.3.45.0</AssemblyVersion>')
          if ($project -notmatch '<Version>1\.3\.45</Version>') {
            throw 'MCPanel.csproj version was not updated to 1.3.45.'
          }
          [IO.File]::WriteAllText((Join-Path $PWD $projectPath), $project, [Text.UTF8Encoding]::new($false))

          $notes = @'
          # MCPanel 1.3.45

          - IIS/.NET 产品安装与“修复绑定”统一将应用程序池托管管道模式设置为 `Integrated`（集成），不再按旧 Framework 版本切换为 `Classic`。
          - 继续使用 Windows IIS 自带的 `appcmd.exe` 显式写入 `/managedPipelineMode:Integrated`；CLR v2.0 / v4.0 / 无托管 CLR 的检测逻辑保持不变。
          - 32 位应用程序开关与现有产品架构判断保持不变；重新绑定已有 IIS 产品时也会把对应应用池修正为集成模式。
          '@
          $notes = $notes -replace '(?m)^          ', ''
          [IO.File]::WriteAllText((Join-Path $PWD 'RELEASE-NOTES.md'), $notes, [Text.UTF8Encoding]::new($false))

      - name: Full regression and Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish145'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated 1.3.45 source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/one-time-integrated-iis-1.3.45.yml'
          git add ProductDeploymentService.cs MCPanel.Tests/ReliabilityTests.IisIntegratedPipeline145.cs MCPanel.csproj RELEASE-NOTES.md
          git diff --cached --check
          git commit -m 'Prepare MCPanel 1.3.45 integrated IIS pipeline'
          git push origin HEAD:main
