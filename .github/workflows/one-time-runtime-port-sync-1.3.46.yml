name: One-time runtime port sync 1.3.46

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by the vendored SharpSvn build.'
          }

      - name: Apply runtime port synchronization
        shell: pwsh
        run: |
          & .\tools\Apply-RuntimePortSync-1.3.46-v2.ps1

      - name: Full regression tests
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj --configuration Release --logger "trx;LogFileName=runtime-port-sync-1.3.46.trx" --results-directory .\TestResults
          if ($LASTEXITCODE -ne 0) {
            throw "Regression tests failed with exit code $LASTEXITCODE."
          }

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-port-sync-diagnostics-1.3.46
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish146'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir

      - name: Commit validated 1.3.46 source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/one-time-runtime-port-sync-1.3.46.yml'
          git rm 'tools/Apply-RuntimePortSync-1.3.46.ps1'
          git rm 'tools/Apply-RuntimePortSync-1.3.46-v2.ps1'
          git add ProductDeploymentService.cs ProductDeploymentService.RuntimeSync.cs NginxProductProxyService.cs MainWindow.xaml.cs MainWindow.RuntimeBindingSync.cs MCPanel.Tests/ReliabilityTests.RuntimePortSync146.cs MCPanel.csproj RELEASE-NOTES.md
          git diff --cached --check
          git commit -m 'Prepare MCPanel 1.3.46 runtime port synchronization'
          git push origin HEAD:main
