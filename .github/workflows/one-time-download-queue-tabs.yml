name: One-time download queue tabs redesign

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-download-queue-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn runtime
        shell: pwsh
        run: choco install vcredist-all -y --no-progress

      - name: Apply queue tabs redesign
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from textwrap import dedent, indent

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig').replace('\r\n', '\n')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # View model: preserve one durable queue, expose two presentation views.
          vm = 'ViewModels/ProductViewModels.cs'
          text = read(vm)
          field_anchor = '    private bool _downloadTotalKnown;\n'
          if '    private bool _showCompletedQueue;\n' not in text:
              text = text.replace(field_anchor, field_anchor + '    private bool _showCompletedQueue;\n', 1)

          start = text.index('    public ObservableCollection<string> RecentEvents { get; } = [];')
          end = text.index('    public bool CanCancel { get => _canCancel;', start)
          queue_props = indent(dedent('''\
          public ObservableCollection<string> RecentEvents { get; } = [];
          public ObservableCollection<ProductInstallQueueItemViewModel> QueueItems { get; } = [];
          public bool IsVisible { get => _isVisible; private set => SetProperty(ref _isVisible, value); }
          public bool HasQueueItems => QueueItems.Count > 0;
          public bool HasActiveQueue => QueueItems.Any(item => !item.IsTerminal);
          public int ActiveQueueCount => QueueItems.Count(item => !item.IsTerminal);
          public int CompletedQueueCount => QueueItems.Count(item => item.IsTerminal);
          public IReadOnlyList<ProductInstallQueueItemViewModel> ActiveQueueItems => QueueItems
              .Where(item => !item.IsTerminal)
              .OrderBy(item => item.Sequence)
              .ToArray();
          public IReadOnlyList<ProductInstallQueueItemViewModel> CompletedQueueItems => QueueItems
              .Where(item => item.IsTerminal)
              .OrderByDescending(item => item.Sequence)
              .ToArray();
          public bool ShowActiveQueue
          {
              get => !ShowCompletedQueue;
              set
              {
                  if (value)
                  {
                      ShowCompletedQueue = false;
                  }
              }
          }
          public bool ShowCompletedQueue
          {
              get => _showCompletedQueue;
              set
              {
                  if (!SetProperty(ref _showCompletedQueue, value))
                  {
                      return;
                  }

                  OnPropertyChanged(nameof(ShowActiveQueue));
                  OnPropertyChanged(nameof(QueuePanelSummaryText));
              }
          }
          public Visibility ActiveQueueEmptyVisibility => ActiveQueueCount == 0 ? Visibility.Visible : Visibility.Collapsed;
          public Visibility ActiveQueueItemsVisibility => ActiveQueueCount == 0 ? Visibility.Collapsed : Visibility.Visible;
          public Visibility CompletedQueueEmptyVisibility => CompletedQueueCount == 0 ? Visibility.Visible : Visibility.Collapsed;
          public Visibility CompletedQueueItemsVisibility => CompletedQueueCount == 0 ? Visibility.Collapsed : Visibility.Visible;
          public Visibility QueueEmptyVisibility => HasQueueItems ? Visibility.Collapsed : Visibility.Visible;
          public Visibility QueueItemsVisibility => HasQueueItems ? Visibility.Visible : Visibility.Collapsed;
          public string QueueSummaryText
          {
              get
              {
                  var active = ActiveQueueItems;
                  if (active.Count == 0)
                  {
                      return "当前没有下载或安装任务";
                  }

                  var running = active.FirstOrDefault(item => item.State == ProductInstallQueueStatus.Running);
                  return running is null
                      ? $"安装队列：等待 {active.Count} 个产品"
                      : $"安装队列：正在处理第 {running.QueuePosition} 项，共 {active.Count} 项";
              }
          }
          public string QueuePanelSummaryText => ShowCompletedQueue
              ? CompletedQueueCount == 0
                  ? "暂无已结束任务记录"
                  : $"最近保留 {CompletedQueueCount} 条任务记录"
              : QueueSummaryText;

          '''), '    ')
          text = text[:start] + queue_props + text[end:]

          notify_start = text.index('    private void NotifyQueueProperties()')
          notify_end = text.index('    private static string ResolveStage', notify_start)
          notify_method = indent(dedent('''\
          private void NotifyQueueProperties()
          {
              OnPropertyChanged(nameof(HasQueueItems));
              OnPropertyChanged(nameof(HasActiveQueue));
              OnPropertyChanged(nameof(ActiveQueueCount));
              OnPropertyChanged(nameof(CompletedQueueCount));
              OnPropertyChanged(nameof(ActiveQueueItems));
              OnPropertyChanged(nameof(CompletedQueueItems));
              OnPropertyChanged(nameof(ActiveQueueEmptyVisibility));
              OnPropertyChanged(nameof(ActiveQueueItemsVisibility));
              OnPropertyChanged(nameof(CompletedQueueEmptyVisibility));
              OnPropertyChanged(nameof(CompletedQueueItemsVisibility));
              OnPropertyChanged(nameof(QueueEmptyVisibility));
              OnPropertyChanged(nameof(QueueItemsVisibility));
              OnPropertyChanged(nameof(QueueSummaryText));
              OnPropertyChanged(nameof(QueuePanelSummaryText));
              OnPropertyChanged(nameof(IsDownloading));
              OnPropertyChanged(nameof(OverallDownloadProgress));
              OnPropertyChanged(nameof(IsQueueActivityAnimating));
          }

          '''), '    ')
          text = text[:notify_start] + notify_method + text[notify_end:]
          write(vm, text)

          # Popup always opens on 下载中.
          products = 'MainWindow.Products.cs'
          text = read(products)
          method = text.index('    private void DownloadQueueButton_Click(object sender, RoutedEventArgs e)')
          insertion = text.index('        ProductsHeader.UpdateLayout();', method)
          reset = '        _model.InstallationProgress.ShowCompletedQueue = false;\n'
          if reset not in text[method:insertion]:
              text = text[:insertion] + reset + text[insertion:]
          write(products, text)

          # Compact terminal history template.
          templates = 'Resources/MainWindowTemplates.xaml'
          text = read(templates)
          if 'x:Key="InstallationQueueHistoryItemTemplate"' not in text:
              marker = '    <DataTemplate x:Key="InstallationRecentEventTemplate">\n'
              history = indent(dedent('''\
          <DataTemplate x:Key="InstallationQueueHistoryItemTemplate">
              <Border Padding="8,10" Background="Transparent" BorderBrush="{DynamicResource LineBrush}" BorderThickness="0,0,0,1">
                  <Grid>
                      <Grid.ColumnDefinitions>
                          <ColumnDefinition Width="52" />
                          <ColumnDefinition Width="*" />
                          <ColumnDefinition Width="76" />
                          <ColumnDefinition Width="40" />
                      </Grid.ColumnDefinitions>
                      <Border Width="42" Height="42" HorizontalAlignment="Center" VerticalAlignment="Center"
                              CornerRadius="8" Background="{DynamicResource SurfaceAltBrush}"
                              BorderBrush="{DynamicResource CardLineBrush}" BorderThickness="1" ToolTip="{Binding ProductName}">
                          <Image Source="{Binding IconPath}" Stretch="Uniform" Margin="3" RenderOptions.BitmapScalingMode="HighQuality" />
                      </Border>
                      <StackPanel Grid.Column="1" Margin="10,0,10,0" VerticalAlignment="Center">
                          <TextBlock Text="{Binding ProductName}" ToolTip="{Binding ProductName}"
                                     Foreground="{DynamicResource TextBrush}" FontSize="12" FontWeight="SemiBold"
                                     TextTrimming="CharacterEllipsis" />
                          <TextBlock FontSize="10" Foreground="{DynamicResource MutedBrush}" Margin="0,3,0,0" TextTrimming="CharacterEllipsis">
                              <Run Text="{Binding ProductId, Mode=OneWay}" />
                              <Run Text=" · " />
                              <Run Text="{Binding Message, Mode=OneWay}" />
                          </TextBlock>
                      </StackPanel>
                      <Border Grid.Column="2" Height="26" MinWidth="64" Padding="8,0" CornerRadius="13"
                              Background="{DynamicResource SurfaceAltBrush}" BorderBrush="{DynamicResource CardLineBrush}"
                              BorderThickness="1" HorizontalAlignment="Right" VerticalAlignment="Center">
                          <TextBlock Text="{Binding StateText}" FontSize="10.5" FontWeight="SemiBold"
                                     HorizontalAlignment="Center" VerticalAlignment="Center">
                              <TextBlock.Style>
                                  <Style TargetType="TextBlock">
                                      <Setter Property="Foreground" Value="{DynamicResource MutedBrush}" />
                                      <Style.Triggers>
                                          <DataTrigger Binding="{Binding ProgressText}" Value="完成">
                                              <Setter Property="Foreground" Value="{DynamicResource MemoryBrush}" />
                                          </DataTrigger>
                                          <DataTrigger Binding="{Binding ProgressText}" Value="失败">
                                              <Setter Property="Foreground" Value="{DynamicResource DangerTextBrush}" />
                                          </DataTrigger>
                                      </Style.Triggers>
                                  </Style>
                              </TextBlock.Style>
                          </TextBlock>
                      </Border>
                      <Button Grid.Column="3" Content="{Binding RemoveActionGlyph}" ToolTip="删除此记录"
                              AutomationProperties.Name="删除此记录" Style="{DynamicResource QueueDangerIconButton}"
                              IsEnabled="{Binding CanRemove}" Click="RemoveQueuedProduct_Click" />
                  </Grid>
              </Border>
          </DataTemplate>

          '''), '    ')
              text = text.replace(marker, history + marker, 1)
          write(templates, text)

          # Popup segmented design.
          xaml_path = 'MainWindow.xaml'
          xaml = read(xaml_path)
          popup = xaml.index('        <Popup x:Name="DownloadQueuePopup"')
          grid_start = xaml.index('                    <Grid>\n                        <Grid.RowDefinitions>', popup)
          popup_end = xaml.index('        </Popup>', grid_start)
          grid_close_start = xaml.rfind('                    </Grid>', grid_start, popup_end)
          if grid_close_start < grid_start:
              raise RuntimeError('Could not locate DownloadQueuePopup outer grid end')
          grid_end = grid_close_start + len('                    </Grid>')
          new_grid = indent(dedent('''\
          <Grid>
              <Grid.Resources>
                  <Style x:Key="DownloadQueueTabButton" TargetType="RadioButton">
                      <Setter Property="Height" Value="34" />
                      <Setter Property="Padding" Value="12,0" />
                      <Setter Property="Foreground" Value="{DynamicResource MutedBrush}" />
                      <Setter Property="FontSize" Value="11.5" />
                      <Setter Property="FontWeight" Value="SemiBold" />
                      <Setter Property="Cursor" Value="Hand" />
                      <Setter Property="HorizontalContentAlignment" Value="Center" />
                      <Setter Property="VerticalContentAlignment" Value="Center" />
                      <Setter Property="Template">
                          <Setter.Value>
                              <ControlTemplate TargetType="RadioButton">
                                  <Border x:Name="TabRoot" Background="Transparent" CornerRadius="6" Padding="{TemplateBinding Padding}">
                                      <ContentPresenter HorizontalAlignment="{TemplateBinding HorizontalContentAlignment}"
                                                        VerticalAlignment="{TemplateBinding VerticalContentAlignment}" />
                                  </Border>
                                  <ControlTemplate.Triggers>
                                      <Trigger Property="IsMouseOver" Value="True">
                                          <Setter TargetName="TabRoot" Property="Background" Value="{DynamicResource NavHoverBrush}" />
                                      </Trigger>
                                      <Trigger Property="IsChecked" Value="True">
                                          <Setter TargetName="TabRoot" Property="Background" Value="{DynamicResource TonalBrush}" />
                                          <Setter Property="Foreground" Value="{DynamicResource TonalTextBrush}" />
                                      </Trigger>
                                  </ControlTemplate.Triggers>
                              </ControlTemplate>
                          </Setter.Value>
                      </Setter>
                  </Style>
              </Grid.Resources>
              <Grid.RowDefinitions>
                  <RowDefinition Height="Auto" />
                  <RowDefinition Height="Auto" />
                  <RowDefinition Height="*" />
                  <RowDefinition Height="Auto" />
              </Grid.RowDefinitions>

              <StackPanel>
                  <TextBlock Text="下载与安装队列" Foreground="{DynamicResource TextBrush}" FontSize="16" FontWeight="SemiBold" />
                  <TextBlock Text="{Binding InstallationProgress.QueuePanelSummaryText}" Foreground="{DynamicResource MutedBrush}"
                             FontSize="11" Margin="0,4,0,0" TextTrimming="CharacterEllipsis" />
              </StackPanel>

              <Border Grid.Row="1" Margin="0,12,0,8" Padding="3" CornerRadius="8"
                      Background="{DynamicResource SurfaceAltBrush}" BorderBrush="{DynamicResource CardLineBrush}" BorderThickness="1">
                  <Grid>
                      <Grid.ColumnDefinitions>
                          <ColumnDefinition Width="*" />
                          <ColumnDefinition Width="*" />
                      </Grid.ColumnDefinitions>
                      <RadioButton Grid.Column="0" GroupName="DownloadQueueTabs" Style="{StaticResource DownloadQueueTabButton}"
                                   IsChecked="{Binding InstallationProgress.ShowActiveQueue, Mode=TwoWay}">
                          <StackPanel Orientation="Horizontal">
                              <TextBlock Text="下载中" VerticalAlignment="Center" />
                              <Border MinWidth="22" Height="18" Margin="7,0,0,0" Padding="6,0" Background="{DynamicResource InputBrush}" CornerRadius="9">
                                  <TextBlock Text="{Binding InstallationProgress.ActiveQueueCount}" FontSize="9.5"
                                             HorizontalAlignment="Center" VerticalAlignment="Center" />
                              </Border>
                          </StackPanel>
                      </RadioButton>
                      <RadioButton Grid.Column="1" GroupName="DownloadQueueTabs" Style="{StaticResource DownloadQueueTabButton}"
                                   IsChecked="{Binding InstallationProgress.ShowCompletedQueue, Mode=TwoWay}">
                          <StackPanel Orientation="Horizontal">
                              <TextBlock Text="已完成" VerticalAlignment="Center" />
                              <Border MinWidth="22" Height="18" Margin="7,0,0,0" Padding="6,0" Background="{DynamicResource InputBrush}" CornerRadius="9">
                                  <TextBlock Text="{Binding InstallationProgress.CompletedQueueCount}" FontSize="9.5"
                                             HorizontalAlignment="Center" VerticalAlignment="Center" />
                              </Border>
                          </StackPanel>
                      </RadioButton>
                  </Grid>
              </Border>

              <Grid Grid.Row="2">
                  <Grid Visibility="{Binding InstallationProgress.ShowActiveQueue, Converter={StaticResource BooleanToVisibility}}">
                      <StackPanel HorizontalAlignment="Center" VerticalAlignment="Center" Margin="0,46"
                                  Visibility="{Binding InstallationProgress.ActiveQueueEmptyVisibility}">
                          <TextBlock Text="当前没有下载或安装任务" Foreground="{DynamicResource TextBrush}" FontSize="12.5"
                                     FontWeight="SemiBold" HorizontalAlignment="Center" />
                          <TextBlock Text="新任务加入后会自动显示在这里" Foreground="{DynamicResource MutedBrush}" FontSize="10.5"
                                     Margin="0,5,0,0" HorizontalAlignment="Center" />
                      </StackPanel>
                      <ScrollViewer MaxHeight="390" VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled"
                                    Visibility="{Binding InstallationProgress.ActiveQueueItemsVisibility}">
                          <ScrollViewer.Resources>
                              <Style TargetType="ScrollBar" BasedOn="{StaticResource ModernVerticalScrollBar}" />
                          </ScrollViewer.Resources>
                          <ItemsControl x:Name="DownloadQueueItemsControl"
                                        ItemsSource="{Binding InstallationProgress.ActiveQueueItems}"
                                        ItemTemplate="{StaticResource InstallationQueueItemTemplate}" />
                      </ScrollViewer>
                  </Grid>

                  <Grid Visibility="{Binding InstallationProgress.ShowCompletedQueue, Converter={StaticResource BooleanToVisibility}}">
                      <StackPanel HorizontalAlignment="Center" VerticalAlignment="Center" Margin="0,46"
                                  Visibility="{Binding InstallationProgress.CompletedQueueEmptyVisibility}">
                          <TextBlock Text="还没有已完成的任务记录" Foreground="{DynamicResource TextBrush}" FontSize="12.5"
                                     FontWeight="SemiBold" HorizontalAlignment="Center" />
                          <TextBlock Text="任务结束后会自动移动到这里" Foreground="{DynamicResource MutedBrush}" FontSize="10.5"
                                     Margin="0,5,0,0" HorizontalAlignment="Center" />
                      </StackPanel>
                      <ScrollViewer MaxHeight="390" VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled"
                                    Visibility="{Binding InstallationProgress.CompletedQueueItemsVisibility}">
                          <ScrollViewer.Resources>
                              <Style TargetType="ScrollBar" BasedOn="{StaticResource ModernVerticalScrollBar}" />
                          </ScrollViewer.Resources>
                          <ItemsControl ItemsSource="{Binding InstallationProgress.CompletedQueueItems}"
                                        ItemTemplate="{StaticResource InstallationQueueHistoryItemTemplate}" />
                      </ScrollViewer>
                  </Grid>
              </Grid>

              <Grid Grid.Row="3" Margin="0,10,0,0">
                  <TextBlock Text="任务按加入时间逐项处理；关闭面板或收起窗口不会中断后台任务。"
                             Foreground="{DynamicResource MutedBrush}" FontSize="10" TextWrapping="Wrap"
                             Visibility="{Binding InstallationProgress.ShowActiveQueue, Converter={StaticResource BooleanToVisibility}}" />
                  <TextBlock Text="部署成功后会自动移到“已完成”；失败和取消任务也会保留在这里便于查看原因，最多保留最近 20 条记录。"
                             Foreground="{DynamicResource MutedBrush}" FontSize="10" TextWrapping="Wrap"
                             Visibility="{Binding InstallationProgress.ShowCompletedQueue, Converter={StaticResource BooleanToVisibility}}" />
              </Grid>
          </Grid>'''), '                    ')
          xaml = xaml[:grid_start] + new_grid + xaml[grid_end:]
          write(xaml_path, xaml)

          # Regression source-contract coverage.
          test_path = Path('MCPanel.Tests/ReliabilityTests.DownloadQueueTabs.cs')
          test = dedent(r'''\
          using System;
          using System.IO;
          using Microsoft.VisualStudio.TestTools.UnitTesting;

          namespace MCPanel.Tests;

          public sealed partial class ReliabilityTests
          {
              [TestMethod]
              public void DownloadQueuePopupSeparatesActiveAndCompletedHistory()
              {
                  var viewModel = ReadDownloadQueueTabsSource(Path.Combine("ViewModels", "ProductViewModels.cs"));
                  var mainXaml = ReadDownloadQueueTabsSource("MainWindow.xaml");
                  var products = ReadDownloadQueueTabsSource("MainWindow.Products.cs");
                  var templates = ReadDownloadQueueTabsSource(Path.Combine("Resources", "MainWindowTemplates.xaml"));

                  StringAssert.Contains(viewModel, "ActiveQueueItems => QueueItems");
                  StringAssert.Contains(viewModel, ".Where(item => !item.IsTerminal)");
                  StringAssert.Contains(viewModel, "CompletedQueueItems => QueueItems");
                  StringAssert.Contains(viewModel, ".Where(item => item.IsTerminal)");
                  StringAssert.Contains(viewModel, ".OrderByDescending(item => item.Sequence)");
                  StringAssert.Contains(viewModel, "get => !ShowCompletedQueue;");
                  StringAssert.Contains(mainXaml, "GroupName=\"DownloadQueueTabs\"");
                  StringAssert.Contains(mainXaml, "Text=\"下载中\"");
                  StringAssert.Contains(mainXaml, "Text=\"已完成\"");
                  StringAssert.Contains(mainXaml, "ItemsSource=\"{Binding InstallationProgress.ActiveQueueItems}\"");
                  StringAssert.Contains(mainXaml, "ItemsSource=\"{Binding InstallationProgress.CompletedQueueItems}\"");
                  StringAssert.Contains(mainXaml, "ItemTemplate=\"{StaticResource InstallationQueueHistoryItemTemplate}\"");
                  StringAssert.Contains(products, "_model.InstallationProgress.ShowCompletedQueue = false;");
                  StringAssert.Contains(templates, "x:Key=\"InstallationQueueHistoryItemTemplate\"");
                  StringAssert.Contains(templates, "Value=\"完成\"");
                  StringAssert.Contains(templates, "Value=\"失败\"");
              }

              private static string ReadDownloadQueueTabsSource(string relativePath)
              {
                  var directory = new DirectoryInfo(AppContext.BaseDirectory);
                  while (directory is not null)
                  {
                      var candidate = Path.Combine(directory.FullName, relativePath);
                      if (File.Exists(Path.Combine(directory.FullName, "MCPanel.csproj")) && File.Exists(candidate))
                      {
                          return File.ReadAllText(candidate);
                      }
                      directory = directory.Parent;
                  }

                  Assert.Fail("Unable to locate repository source: " + relativePath);
                  return string.Empty;
              }
          }
          ''')
          test_path.write_text(test, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Validate diff
        shell: pwsh
        run: |
          git diff --check
          git diff -- MainWindow.xaml MainWindow.Products.cs ViewModels/ProductViewModels.cs Resources/MainWindowTemplates.xaml MCPanel.Tests/ReliabilityTests.DownloadQueueTabs.cs

      - name: Test redesign
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release

      - name: Commit feature
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.Products.cs ViewModels/ProductViewModels.cs Resources/MainWindowTemplates.xaml MCPanel.Tests/ReliabilityTests.DownloadQueueTabs.cs
          git commit -m "feat: split download queue into active and completed tabs"
          git push origin main
