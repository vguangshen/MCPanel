name: One-time legacy cleanup 1.3.51

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup-test-publish:
    if: github.event.head_commit.message == 'Run legacy cleanup validation for 1.3.51 second pass'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install the VC++ runtime bundle required by SharpSvn.'
          }

      - name: Apply legacy cleanup
        shell: pwsh
        run: |
          & .\tools\Run-Cleanup-Legacy-1.3.51.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full regression tests
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'MCPanelRegression151'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release --logger "trx;LogFileName=regression.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCPanelRegression151-${{ github.run_id }}
          path: ${{ runner.temp }}\MCPanelRegression151\*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Win-x64 publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish151'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'MCPanel.exe'))) {
            throw 'Win-x64 publish did not produce MCPanel.exe.'
          }

      - name: Commit validated cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- '.github/workflows/one-time-legacy-cleanup-1.3.51.yml'
          git rm -- 'tools/Cleanup-Legacy-1.3.51.ps1'
          git rm -- 'tools/Run-Cleanup-Legacy-1.3.51.ps1'
          git add --all
          git commit -m "Prepare MCPanel 1.3.51 legacy cleanup"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to commit validated MCPanel 1.3.51 cleanup.'
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to push validated MCPanel 1.3.51 cleanup to main.'
          }
