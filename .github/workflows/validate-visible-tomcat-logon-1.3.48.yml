name: Validate visible Tomcat logon 1.3.48

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.event.head_commit.message, 'Validate MCPanel 1.3.48 visible Tomcat startup')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Validate version and Tomcat logon contract
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'MCPanel.csproj' -Raw
          if ([string]$project.Project.PropertyGroup.Version -ne '1.3.48') {
            throw 'Expected MCPanel version 1.3.48.'
          }
          $startup = Get-Content -LiteralPath 'TomcatLogonStartup.cs' -Raw
          if ($startup -notmatch 'EnvironmentRuntimeService\.LaunchTomcatConsole\(root\)') {
            throw 'Logon startup does not use the visible manual Catalina launcher.'
          }
          foreach ($forbidden in @('InitialDelay', 'RetryDelay', 'StartupProbeTimeout', 'ProcessWindowStyle.Hidden', 'StartHiddenCatalina', 'WaitForSharedTomcatAsync')) {
            if ($startup.Contains($forbidden)) {
              throw "Forbidden legacy hidden/delayed logon behavior remains: $forbidden"
            }
          }

      - name: Full test and Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish148'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Publish-WinX64 validation failed.'
          }
