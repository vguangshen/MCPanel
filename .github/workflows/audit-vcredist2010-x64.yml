name: Audit VC++ 2010 x64 direct install

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-vcredist2010-x64.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install only Microsoft VC++ 2010 SP1 x64 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:WINDIR 'System32\MSVCR100.dll'
          if (Test-Path -LiteralPath $runtime) {
            $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime).FileVersion
            Write-Host "Runtime already present: $runtime ($version)"
            exit 0
          }

          $url = 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'vcredist2010-sp1-x64.exe'
          $sw = [System.Diagnostics.Stopwatch]::StartNew()

          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $downloadElapsed = $sw.Elapsed.TotalSeconds
          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Signature status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Downloaded VC++ 2010 x64 installer did not have a valid Microsoft Authenticode signature.'
          }

          $process = Start-Process -FilePath $installer -ArgumentList '/q', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "VC++ 2010 x64 installer failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $runtime)) {
            throw "Installer completed but required runtime is still missing: $runtime"
          }

          $sw.Stop()
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($runtime).FileVersion
          Write-Host ("Download elapsed: {0:N2}s" -f $downloadElapsed)
          Write-Host ("Total direct x64 install elapsed: {0:N2}s" -f $sw.Elapsed.TotalSeconds)
          Write-Host "Installed runtime: $runtime ($version)"
