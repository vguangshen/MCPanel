name: One-time Tomcat product popup fix 1.3.41

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.head_commit.message == 'Run one-time Tomcat product popup fix 1.3.41'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SharpSvn native runtime dependencies
        shell: pwsh
        run: |
          choco install vcredist-all -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the VC++ runtime bundle required by the vendored SharpSvn build."
          }

      - name: Apply popup cleanup and runtime modal audit
        shell: pwsh
        run: |
          & .\tools\Fix-TomcatProductStartPopup-1.3.41.ps1

      - name: Full regression tests
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }

      - name: Win-x64 publish validation
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'MCPanelPublish141'
          & .\Publish-WinX64.ps1 -OutputDirectory $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Win-x64 publish validation failed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'MCPanel.exe'))) {
            throw 'Publish validation did not produce MCPanel.exe.'
          }

      - name: Commit validated 1.3.41 source
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/one-time-tomcat-product-popup-1.3.41.yml' -Force
          Remove-Item -LiteralPath 'tools/Fix-TomcatProductStartPopup-1.3.41.ps1' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release MCPanel 1.3.41'
          git push origin HEAD:main
