name: Validate Tomcat truthfulness changes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-tomcat-truthfulness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore MCPanel.Tests/MCPanel.Tests.csproj

      - name: Build
        shell: pwsh
        run: dotnet build MCPanel.csproj -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test MCPanel.Tests/MCPanel.Tests.csproj -c Release --no-restore --verbosity normal
