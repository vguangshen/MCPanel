name: One-time update concurrency and elevation v2

on:
  push:
    branches:
      - main
    paths:
      - 'tools/apply-update-concurrency-elevation-v2.flag'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply corrected patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/one-time-update-concurrency-elevation.yml').read_text(encoding='utf-8')
          match = re.search(r"          @'\n(.*?)\n          '@ \| python", workflow, re.S)
          if match is None:
              raise SystemExit('Could not extract original patch program.')
          program = textwrap.dedent(match.group(1))
          exec(compile(program, '<update-concurrency-patch>', 'exec'), {})

          path = Path('ApplicationUpdateService.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    public void LaunchUpdater(
              PreparedApplicationUpdate update,
              ApplicationUpdateAuthorization? authorization = null)
          {
          '''
          new = '''    public void LaunchUpdater(PreparedApplicationUpdate update) =>
              LaunchUpdater(update, authorization: null);

          internal void LaunchUpdater(
              PreparedApplicationUpdate update,
              ApplicationUpdateAuthorization? authorization)
          {
          '''
          if old not in text:
              raise SystemExit('Corrected LaunchUpdater target not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python

      - name: Test
        shell: pwsh
        run: |
          dotnet test .\MCPanel.Tests\MCPanel.Tests.csproj -c Release --nologo

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "Xiangming"
          git config user.email "40314529+vguangshen@users.noreply.github.com"
          git add ApplicationUpdateService.cs App.xaml.cs MainWindow.xaml.cs MainWindow.Settings.cs MCPanel.Tests/ReliabilityTests.ApplicationUpdateConcurrency119.cs
          git commit -m "fix: allow updates alongside product downloads with preauthorized UAC"
          git push origin HEAD:main
